<script>
const $=s=>document.querySelector(s);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
let S;try{S=JSON.parse(localStorage.getItem('opt'))}catch(e){}
S=Object.assign({v:{},d:{},o:{},tab:'ex',lt:'souple',rt:'ex',oph:[],cab:{},txt:[],man:{},shops:[],shop:0,opts:[],opt:0,pad:false},S||{});
if(!S.v['a.date'])S.v['a.date']=today();
(()=>{const sf=['mag','adr','cp','tel','mail','ville','logo'],pf=['nom','qual','id'];S.pad=false;
if(!S.shops.length&&sf.some(k=>S.cab[k])){const o={};sf.forEach(k=>{if(S.cab[k]!==undefined){o[k]=S.cab[k];delete S.cab[k]}});S.shops.push(o);S.shop=0}
if(!S.opts.length&&pf.some(k=>S.cab[k])){const o={};pf.forEach(k=>{if(S.cab[k]!==undefined){o[k]=S.cab[k];delete S.cab[k]}});if(o.qual===undefined)o.qual='Opticien-lunetier';S.opts.push(o);S.opt=0}})();
const SHK=['mag','adr','cp','tel','mail','ville','logo'],OPK=['nom','qual','id','sig'];
const fmtTel=v=>{v=String(v||'').trim();if(!v)return'';const d=v.replace(/[^\d+]/g,'');if(/^\+33\d{9}$/.test(d))return'+33 '+d[3]+' '+d.slice(4).replace(/(\d\d)(?=\d)/g,'$1 ');if(/^0\d{9}$/.test(d))return d.replace(/(\d\d)(?=\d)/g,'$1 ');return v};
const cabM=()=>({...S.cab,...(S.shops[S.shop]||{}),...(S.opts[S.opt]||{})});
const cabSet=(k,v)=>{if(OPK.includes(k)){if(!S.opts.length){S.opts.push({qual:'Opticien-lunetier'});S.opt=0}S.opts[S.opt][k]=v}else if(SHK.includes(k)){if(!S.shops.length){S.shops.push({});S.shop=0}S.shops[S.shop][k]=v}else S.cab[k]=v};
const save=()=>{try{localStorage.setItem('opt',JSON.stringify(S))}catch(e){}};
const V=k=>S.v[k]??'',N=k=>parseFloat(String(V(k)).replace(',','.'));
const has=(k,x)=>(S.v[k]||[]).includes(x);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const q=x=>Math.round(x*4)/4,fm=x=>isNaN(x)?'–':(x>0?'+':'')+x.toFixed(2),vx=F=>F/(1-0.012*F);
const E=['od','og'],U=e=>e.toUpperCase();
const F=(k,l,t='t',o,w,x)=>({k,l,t,o,w,...x});
const SG={sg:1},NG={neg:1};
const PAR=['P1.5','P2','P3','P4','P5','P6','P8','P10','P14','P20'];
const rxe=(id,e,av,add)=>[F(`${id}.${e}s`,U(e)+' sph','n',0,0,SG),F(`${id}.${e}c`,U(e)+' cyl','n',0,0,NG),F(`${id}.${e}a`,U(e)+' axe °','n'),...(av?[F(`${id}.${e}v`,U(e)+' AV','n',0,0,{av:1})]:[]),...(add?[F(`${id}.${e}d`,U(e)+' addition','n',0,0,SG)]:[])];
const rx=(id,av,add)=>E.flatMap(e=>rxe(id,e,av,add));
const avf=id=>['od','og','odg'].flatMap(e=>[F(`${id}.${e}l`,U(e)+' loin (sur 10)','n',0,0,{av:1}),F(`${id}.${e}p`,U(e)+' près (Parinaud)','s',PAR)]);
const D=s=>s?new Date(s+'T00:00:00'):null;
const fdt=s=>s?s.split('-').reverse().join('/'):'';
const fd=d=>d.toLocaleDateString('fr-FR');
const ageAt=(d,r)=>{if(!d)return NaN;const a=D(d),b=r?D(r):new Date();let y=b.getFullYear()-a.getFullYear();if(b<new Date(b.getFullYear(),a.getMonth(),a.getDate()))y--;return y};
const age=()=>ageAt(V('a.dob'),V('a.date')||today());
const addAge=a=>a<40?0:a<45?.75:a<50?1:a<55?1.5:a<60?2:2.25;
const bizAdd=(s,n)=>{const d=D(s);while(n>0){d.setDate(d.getDate()+1);if(d.getDay()%6)n--}return d};
const cp=x=>has('a.c',x);
const RF=["Baisse brutale de vision","Flashs / voile / corps flottants récents","Douleur ou rougeur oculaire","Diplopie récente","Traumatisme oculaire"];
const CP=["Flou de loin","Flou de près","Maux de tête","Fatigue visuelle / écrans","Diplopie ancienne ou intermittente","Lignes déformées"];
const OPP="Opposition ou limitation d'adaptation mentionnée sur l'ordonnance";
const SIT=["Glaucome ou hypertonie oculaire","Pathologie rétinienne (DMLA, rétinopathie diabétique)","Cataracte","Chirurgie réfractive","Anomalie cornéenne (kératocône, greffe, kératopathie)","Amblyopie bilatérale","Diplopie récente ou évolutive","Traumatisme oculaire sévère de moins de 3 ans","Diabète","Maladie auto-immune","HTA mal contrôlée","Traitement au long cours à risque oculaire"];
const DEM=["RI : renouvellement identique","RA : renouvellement adapté","POM : demande de primo-ordonnance modifiée","Orienter vers l'ophtalmologiste"];
const dec=v=>{v=String(v??'').trim().replace(',','.');if(!v)return NaN;if(v.includes('/')){const[a,b]=v.split('/').map(parseFloat);return b?a/b:NaN}const n=parseFloat(v);if(isNaN(n))return NaN;return /\./.test(v)&&n<=2.5?n:n/10};
const x10=v=>{v=String(v??'').trim();if(!v)return'';const n=dec(v);return isNaN(n)?v:`${Math.round(n*10)}/10`};
const adj=(v,d)=>{const x=parseFloat(String(v).replace(',','.'));if(isNaN(x))return'';const y=Math.round((x+d)*100)/100;return y===0?'0.00':(y>0?'+':'')+y.toFixed(2)};
const bestAV=e=>{for(const p of['sc','cyl','sub']){const x=dec(V(`${p}.${e}v`));if(!isNaN(x))return x}return NaN};
const subAV=()=>E.some(e=>bestAV(e)<0.8);
const pres=()=>age()>=40||cp("Flou de près");
const amp=()=>{const b=N('pr.bn'),o=N('pr.od'),d=b>0?b:o>0?o:NaN;return isNaN(d)?NaN:100/d};
const phoS=(t,v)=>{v=Math.abs(parseFloat(String(v??'').replace(',','.')));if(isNaN(v)||!t||t=='Orthophorie')return 0;return t=='Ésophorie'?v:-v};
const phoAbn=()=>{const l=phoS(V('pho.hlt'),V('pho.hlv')),p=phoS(V('pho.hpt'),V('pho.hpv'));return l<-3||l>1||p<-6||p>1||Math.abs(parseFloat(V('pho.vlv')))>=1||Math.abs(parseFloat(V('pho.vpv')))>=1};
const bin=()=>phoAbn()||V('a.bin')=='Inclure systématiquement'||age()<16||["Maux de tête","Fatigue visuelle / écrans","Diplopie ancienne ou intermittente"].some(x=>cp(x))||Math.abs(N('sc.ods')-N('sc.ogs'))>=1||V('eq.res')=='Égalité impossible (dominant favorisé)';
const cylNeeded=()=>E.some(e=>['o','l','ord'].some(p=>Math.abs(N(`${p}.${e}c`))>=.25)||N(`sub.${e}v`)<1);
const always=()=>true,soft=()=>S.lt=='souple';
const alerts=()=>{const a=[];RF.filter(x=>has('a.c',x)).forEach(x=>a.push(`Signe d'alerte (${x}) : suspendre le protocole et orienter vers un ophtalmologiste, en urgence si le signe est récent.`));if(subAV())a.push("Acuité corrigée < 8/10 : rechercher une cause (trou sténopéique) et orienter si elle persiste.");return a};

/* ---- Contrôle réglementaire ---- */
const rxv=(p,e)=>({s:N(`${p}.${e}s`),c:N(`${p}.${e}c`)||0,a:N(`${p}.${e}a`),d:N(`${p}.${e}d`)});
const nv=x=>x&&!isNaN(x.s);
const CFX={p:'a',dem:'cc.dem',fin:e=>{const x=rxv('cc',e);return nv(x)?x:rxv('sc',e)},prev:e=>rxv('ord',e)};
const CFL={p:'ka',cl:1,dem:'kf.dem',fin:e=>rxv('kr',e),prev:e=>rxv('ko',e)};
const lppHits=c=>{const P=E.map(e=>({n:c.fin(e),o:c.prev(e)}));if(!P.every(x=>nv(x.n)&&nv(x.o)))return null;const h=[],nt=[],T=1e-9,L=['OD','OG'],f=v=>v.toFixed(2).replace('.',','),dS=x=>Math.abs(x.n.s-x.o.s),dC=x=>Math.abs(x.n.c-x.o.c),ok=v=>!isNaN(v);
const v1=P.map(x=>Math.max(dS(x),dC(x))),det=a=>L.map((l,i)=>`${l} ${f(a[i])}`).join(' ; ');
if(v1.some(v=>v>=.5-T))h.push(`variation de sphère ou de cylindre d'au moins 0,50 D sur un verre (${det(v1)})`);
else if(v1.every(v=>v>=.25-T))h.push(`variation de sphère ou de cylindre d'au moins 0,25 D sur chacun des deux verres (${det(v1)})`);
if(P.some(x=>(ok(x.n.d)&&x.n.d!==0)||(ok(x.o.d)&&x.o.d!==0))){if(!P.every(x=>ok(x.n.d)&&ok(x.o.d)))nt.push("Addition non renseignée (ordonnance ou nouvelle correction, pour un œil) : critères d'addition non évalués.");else{const dist=P.some(x=>dS(x)>T||dC(x)>T),da=P.map(x=>Math.abs(x.n.d-x.o.d));
if(!dist){if(da.some(v=>v>=.5-T))h.push(`variation de l'addition d'au moins 0,50 D sur un verre (${det(da)})`);else if(da.every(v=>v>=.25-T))h.push(`variation de l'addition d'au moins 0,25 D sur chacun des deux verres (${det(da)})`)}
else{const sm=P.map((x,i)=>dS(x)+da[i]),sn=P.map((x,i)=>dS(x)+Math.abs((x.n.s+x.n.d)-(x.o.s+x.o.d)));if(sm.some(v=>v>=.5-T))h.push(`somme des variations de loin (sphère) et de près (addition) d'au moins 0,50 D (${det(sm)})`);else if(sn.some(v=>v>=.5-T))nt.push("Cas limite non retenu : la somme loin + près n'atteint 0,50 D que si l'on compte la puissance de près (sphère + addition). Le texte est ambigu : à valider auprès de la CPAM.")}}}
P.forEach((x,i)=>{const cy=Math.abs(x.n.c);if(cy&&ok(x.n.a)&&ok(x.o.a)){let d=Math.abs(x.n.a-x.o.a)%180;d=Math.min(d,180-d);const th=cy<=1?20:cy<=4?10:5;if(d>th)h.push(`variation de l'axe ${L[i]} de ${d}° (seuil : plus de ${th}°)`)}});return{h,nt}};
const lg=c=>{let Zn='top';const r=[],A=(t,m)=>r.push([t,m,Zn]),P=c.p,dob=V('a.dob'),dt=V('a.date')||today(),od=V(P+'.ord'),an=age();
const prim=(V(P+'.prim')||'').startsWith('Premi'),opp=has(P+'.opp',OPP);
if(!dob)A('in',"Renseigner la date de naissance pour le contrôle réglementaire.");
if(!od)A('in',"Renseigner la date de l'ordonnance.");
let valid=null,yrs=1;
if(dob&&od){const ap=ageAt(dob,od),dur=c.cl?(prim||an<16?1:3):(ap<16?1:ap<=42?5:3),ex=D(od);ex.setFullYear(ex.getFullYear()+dur);valid=D(dt)<=ex;yrs=(D(dt)-D(od))/31557600000;const y=dur>1?'ans':'an';
A(valid?'ok':'al',c.cl?(valid?`Ordonnance de lentilles dans le délai (${dur} ${y}, jusqu'au ${fd(ex)}) : adaptation possible.`:`Ordonnance de lentilles de plus de ${dur} ${y} (échue le ${fd(ex)}) : adaptation impossible, nouvelle prescription nécessaire.`):(valid?`Ordonnance valide : prescrite à ${ap} ans, validité ${dur} ${y}, jusqu'au ${fd(ex)}.`:`Ordonnance périmée depuis le ${fd(ex)} (prescrite à ${ap} ans, validité ${dur} ${y}) : ni renouvellement identique ni adaptation, nouvelle prescription nécessaire.`))}
if(opp)A('al',"Opposition ou limitation du prescripteur : adaptation interdite, délivrance à l'identique uniquement.");

{id:'pa',t:"Presbytie : cylindre croisé fusionné (Jackson)",w:pres,why:"Affine l'addition en mesurant le retard d'accommodation.",how:["Correction de loin finale en place, éclairage de lecture, cible en grille (lignes horizontales et verticales) à 40 cm.","Poser l'addition de départ.","Placer le cylindre croisé ±0,50 D, axe négatif (trait rouge) vertical, puis retourner.","« Les lignes horizontales ou verticales sont-elles plus nettes ? »","Horizontales plus nettes : ajouter +0,25 D. Verticales plus nettes : retirer 0,25 D. Recommencer jusqu'à l'égalité.","La valeur à l'égalité est l'addition proposée, à valider en lecture."],f:[F('pa.add','Addition de départ','n',0,0,SG),F('pa.s','Lignes les plus nettes au départ','s',['Horizontales','Verticales','Égales']),F('pa.res',"Addition à l'égalité",'n',0,0,SG)],

{id:'pn',t:"Presbytie : accommodation relative (NRA / PRA)",w:pres,why:"Contrôle l'addition par l'équilibre des réserves.",how:["Correction de loin et addition provisoire en place, texte à 40 cm, binoculaire.","NRA : ajouter des sphères +0,25 D jusqu'au premier flou soutenu. NRA = total des plus ajoutés.","PRA : revenir à l'addition provisoire, ajouter des sphères −0,25 D jusqu'au premier flou. PRA = total des moins ajoutés.","Repères adulte jeune : NRA ≈ +2,00 D, PRA ≈ −2,37 D (réduits chez le presbyte).","Addition finale = addition provisoire + (NRA − PRA) ÷ 2, PRA en valeur absolue."],f:[F('pn.add','Addition provisoire','n',0,0,SG),F('pn.nra','NRA (D)','n'),F('pn.pra','PRA (valeur absolue, D)','n')],
calc:()=>{const a=N('pn.add'),n=N('pn.nra'),p=Math.abs(N('pn.pra'));return isNaN(a+n+p)?"Renseigner addition, NRA et PRA pour obtenir l'addition finale.":`Addition finale ≈ ${fm(q(a+(n-p)/2))} D.`}},
{id:'pf',t:"Presbytie : plage de netteté et validation",w:pres,why:"Vérifie que l'addition couvre les distances d'usage.",how:["Addition retenue en place, texte fin sur réglette, binoculaire.","Rapprocher le texte jusqu'au premier flou : punctum proximum (PP). L'éloigner jusqu'au premier flou : punctum remotum (PR).","Plage de netteté = PR − PP, elle doit couvrir la distance habituelle (par exemple 30 à 60 cm).","PP trop éloigné : augmenter l'addition. PR trop proche : la diminuer.","Valider en situation : texte réel, smartphone, écran."],f:[F('pf.od','OD addition finale','n',0,0,SG),F('pf.og','OG addition finale','n',0,0,SG),F('pf.pp','ODG PP (cm)','n'),F('pf.pr','ODG PR (cm)','n'),F('pf.n','Notes, usage écrans','a')],

{id:'bn',t:"Vision binoculaire : motilité, cover test, convergence",w:bin,why:"Ajouté car plainte de fatigue, céphalées, diplopie, jeune âge, anisométropie ou équilibre difficile (ou demandé dans l'anamnèse).",how:["Motilité : suivre une cible en H à 40 cm, noter limitation, nystagmus, douleur, diplopie.","Cover test de loin (5 m) puis de près (40 cm) : cacher un œil, observer l'œil découvert (tropie), puis cover alterné pour la phorie.","Œil qui bouge vers l'intérieur : exo ; vers l'extérieur : éso ; vers le bas : hyper.","PPC : approcher une cible fine dans l'axe, noter la distance de rupture (l'œil dévie) et de récupération (rupture environ 5 à 10 cm)."],f:[F('bn.cl','Cover test de loin','s',['Orthophorie','Exophorie','Ésophorie','Hyperphorie','Exotropie','Ésotropie','Hypertropie']),F('bn.cp','Cover test de près','s',['Orthophorie','Exophorie','Ésophorie','Hyperphorie','Exotropie','Ésotropie','Hypertropie']),F('bn.mot','Motilité','s',['Normale','Limitée','Douloureuse ou diplopie']),F('bn.rup','PPC rupture (cm)','n'),F('bn.rec','PPC récupération (cm)','n'),F('bn.n','Notes','a')],

{id:'bs',t:"Vision binoculaire : fusion et stéréoscopie",w:bin,why:"Vérifie la fusion, la suppression et le relief.",how:["Test de Worth (4 points) avec lunettes rouge devant l'OD et vert devant l'OG, de loin puis de près.","4 points : fusion. 5 points : diplopie. 2 points rouges : suppression OG. 3 points verts : suppression OD.","Stéréoscopie (Lang, Titmus ou Randot) à 40 cm avec la correction de près, lunettes polarisantes.","Noter l'acuité stéréoscopique en secondes d'arc (normale : 60″ ou moins)."],f:[F('bs.wl','Worth de loin','s',['4 points (fusion)','5 points (diplopie)','2 points rouges (suppression OG)','3 points verts (suppression OD)']),F('bs.wp','Worth de près','s',['4 points (fusion)','5 points (diplopie)','2 points rouges (suppression OG)','3 points verts (suppression OD)']),F('bs.t','Test utilisé','s',['Lang','Titmus','Randot']),F('bs.st','Stéréoacuité (secondes d\'arc)','n')],

"clariti multifocal / clariti 1 day multifocal (CooperVision)":{init:(a,d,bs)=>{const hy=bs>0;if(a<=1.75)return{des:'LOW',adj:!d&&hy?.25:0};if(a<=2.25)return d?{des:'LOW',adj:hy?.25:0}:{des:'LOW',adj:.5};return d?{des:'LOW',adj:.25}:{des:'HIGH',adj:.25}},how:[DOM1,"Meilleure sphère (BS) = sphère équivalente compensée du vertex. ADD lunettes +0,75 à +1,75 : LOW ; +2,00 à +2,25 : LOW ; au-delà de +2,25 : LOW dominant, HIGH non dominant.","Myope ou emmétrope : dominant BS, non dominant BS (jusqu'à +1,75) ou BS +0,50 (+2,00 à +2,25) ; hypermétrope : dominant BS (jusqu'à +1,75) ou BS +0,25, non dominant BS +0,25 (jusqu'à +1,75) ou BS +0,50 (+2,00 à +2,25). Au-delà de +2,25 : BS +0,25 des deux côtés.",...CVX]},
"Proclear 1 day Multifocal (CooperVision)":{init:(a,d)=>({des:'Profil unique',adj:d?.5:(a<=1?.5:1.25)}),how:[DOM1,"Profil de puissance unique (centre-près asphérique) avec « near boost » : œil dominant BS +0,50 D ; œil non dominant BS +0,50 D (ADD jusqu'à +1,00) ou BS +1,25 D (ADD +1,25 à +2,50).","BS = sphère équivalente compensée du vertex.",...CVX]},
"Biofinity / Proclear multifocal D-N (CooperVision)":{init:(a,d)=>{const v=Math.min(2.5,Math.max(1,Math.floor(a*2)/2));return{des:(d||v<=1.5?'D':'N')+' +'+v.toFixed(2),adj:0}},how:[DOM1,"ADD arrondie à la valeur disponible inférieure (+1,00 ; +1,50 ; +2,00 ; +2,50).","ADD +1,00 et +1,50 : design D (centre distance) sur les deux yeux ; ADD +2,00 et +2,50 : D sur l'œil dominant, N (centre près) sur l'œil non dominant.","Puissance de départ : sphère équivalente compensée du vertex. Version torique : sphère équivalente et axe arrondi aux 5° ; évaluer l'orientation et corriger l'axe avant d'affiner les puissances.",...CVX]},
"AIR OPTIX plus HydraGlyde / DAILIES TOTAL1 Multifocal (Alcon)":{init:a=>({des:a<=1.25?'LO':a<=2?'MED':'HI',adj:.25}),how:["Partir d'une réfraction lunettes du jour. Puissance de départ : sphère équivalente la plus positive, compensée du vertex, +0,25 D pour chaque œil.","ADD la plus basse acceptable : jusqu'à +1,25 : LO ; +1,50 à +2,00 : MED ; +2,25 à +2,50 : HI (même ADD aux deux yeux).","Laisser 5 à 10 minutes d'adaptation hors de la salle d'examen.","Sur-réfraction de loin, les deux yeux ouverts, œil par œil, en ajoutant du plus par pas de 0,25 D jusqu'à un flou de loin ; vérifier en binoculaire loin et près.","Appliquer la sur-réfraction en gardant la même ADD. Contrôle à 3-5 jours ; si besoin, tableau « Enhancements » du guide Alcon en gardant l'ADD si possible."]},

const prop=e=>{const s=N(`kr.${e}s`);if(isNaN(s))return null;const c=N(`kr.${e}c`)||0,a=N(`kr.${e}a`),k=kk(e),h=N('km.hvid'),o={},cc=comp(e),SE=vx(s+c/2),m=isMF()?mfInit(e):null;

const nextLens=e=>{const o={bc:N(`kp.${e}bc`),d:N(`kp.${e}d`),dp:0,n:[]},m=V(`ke.${e}m`),c=V(`ke.${e}c`),v=V(`ke.${e}v`),f=V(`ke.${e}f`);

else{if(f=='Stagnation centrale'){o.bc+=.05;o.dp=.25;o.n.push('trop serrée : BC +0,05 mm, puissance +0,25 D')}if(f=='Appui central'){o.bc-=.05;o.dp=-.25;o.n.push('trop plate : BC −0,05 mm, puissance −0,25 D')}if(m=='Excessif'){o.d+=.2;o.n.push('mouvement excessif : Ø +0,2 mm')}if(m=='Faible'&&f!='Appui central'){o.d-=.2;o.n.push('mouvement faible : Ø −0,2 mm')}if(c=='Basse'){o.d+=.2;o.n.push('centrage bas : Ø +0,2 mm')}if(c=='Haute')o.n.push('centrage haut : BC plus serrée ou Ø plus grand');if(f=='Alignement'&&m=='Correct'&&c=='Centrée')o.n.push('adaptation acceptable')}return o};
const mfAdj=(e,p,ad)=>{const b=V('kp.marque'),vl=V('ks.vl')=='À améliorer',vn=V('ks.vn')=='À améliorer',dm=isDom(e),n=[];if(!MFB[b])return{p,ad,n};

else if(/CooperVision/.test(b)){if(vl&&dm)n.push(`loin à améliorer : essayer ${fm(p-.25)} ou ${fm(p+.25)}, ADD inchangée (guide CooperVision)`);if(vn&&!dm)n.push(`près à améliorer : essayer ${fm(p-.25)} ou ${fm(p+.25)}, ADD inchangée (guide CooperVision)`)}

else if(d.addop!==undefined){const n=prompt("Nom et prénom de l'opticien");if(!n||!n.trim())return;S.opts.push({nom:n.trim(),qual:'Opticien-lunetier'});S.opt=S.opts.length-1}
else if(d.delop!==undefined){if(!confirm('Supprimer cet opticien ?'))return;S.opts.splice(S.opt,1);S.opt=Math.max(0,S.opt-1)}
else if(d.act=='pad'){S.pad=true}else if(d.act=='padclear'){}else if(d.act=='padcancel'){S.pad=false}
else if(d.act=='padsave'){const cv=document.querySelector('#pad');if(cv)cabSet('sig',cv.toDataURL('image/png'));S.pad=false}
else if(d.act=='delsig'){const o=S.opts[S.opt];if(o)delete o.sig}
else if(d.delshop!==undefined){if(!confirm('Supprimer ce magasin ?'))return;S.shops.splice(S.shop,1);S.shop=Math.max(0,S.shop-1)}
else if(d.addtxt!==undefined){const x=prompt('Texte à enregistrer dans la liste (modifiable avant validation)',V(d.addtxt)||'');if(!x||!x.trim())return;S.txt.push(x.trim())}
else if(d.deltxt!==undefined)S.txt.splice(+d.deltxt,1);
else if(d.act=='install'){if(DP){DP.prompt();DP.userChoice.then(()=>{DP=null;render()})}return}
else if(d.act=='print'){print();return}
else if(d.act=='share'){share();return}
else if(d.act=='dellogo'){const sh=S.shops[S.shop];if(sh)delete sh.logo}
else if(d.act=='new'){if(!confirm("Effacer toutes les données du patient en cours et repartir de zéro ? (vos magasins, opticiens, ophtalmologistes et textes sont conservés)"))return;S.v={'a.date':today()};S.d={};S.o={a:true,ka:true};S.man={};scrollTo(0,0)}
else if(d.act=='fill'){SRC.filter(x=>x[0].startsWith(d.to+'.')).forEach(x=>delete S.man[x[0]])}
save();render()});
document.addEventListener('toggle',e=>{if(e.target.dataset&&e.target.dataset.id){S.o[e.target.dataset.id]=e.target.open;save()}},true);
document.addEventListener('input',e=>{const t=e.target;if(t.type=='text'&&t.closest&&t.closest('.dtr')){const d=t.value.replace(/\D/g,'').slice(0,8);let o=d.slice(0,2);if(d.length>2)o+='/'+d.slice(2,4);if(d.length>4)o+='/'+d.slice(4);t.value=o}});
const fkey=a=>{if(!a||!a.closest)return null;if(a.dataset&&a.dataset.d)return'D|'+a.dataset.d;if(a.dataset&&a.dataset.p)return'P|'+a.dataset.p;const r=a.closest('[data-k]');return r?r.dataset.k+'|'+a.tagName+'|'+a.type+'|'+(a.type=='checkbox'?a.value:''):null};
const ffind=k=>{const p=k.split('|');if(p[0]=='D')return document.querySelector(`#m [data-d="${p[1]}"]`);if(p[0]=='P')return document.querySelector(`#m [data-p="${p[1]}"]`);return[...document.querySelectorAll('#m [data-k]')].filter(r=>r.dataset.k==p[0]).flatMap(r=>r.matches('input,select,textarea')?[r]:[...r.querySelectorAll('input,select,textarea')]).find(e=>e.tagName==p[1]&&String(e.type)==p[2]&&(p[2]!='checkbox'||e.value==p[3]))};
function renderKeep(){const a=document.activeElement,k=fkey(a),y=scrollY;render();if(k){const n=ffind(k);if(n){try{n.focus({preventScroll:true})}catch(e){}}}scrollTo(0,y)}
let _lt;const later=()=>{clearTimeout(_lt);_lt=setTimeout(renderKeep,0)};
document.addEventListener('change',e=>{const t=e.target,dr=t.closest&&t.closest('.dtr');
if(t.dataset.logo!==undefined){const fl=t.files[0];if(!fl)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,400/im.width,200/im.height),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(im.width*k));cv.height=Math.max(1,Math.round(im.height*k));cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cabSet('logo',cv.toDataURL('image/png'));save();render()};im.src=rd.result};rd.readAsDataURL(fl);return}
if(t.dataset.c){S.cab[t.dataset.c]=t.value;save();return}
if(t.dataset.shop!==undefined){S.shop=+t.value;save();later();return}
if(t.dataset.opsel!==undefined){S.opt=+t.value;save();later();return}
if(t.dataset.op){const o=S.opts[S.opt];if(o){o[t.dataset.op]=t.value;save();if(t.dataset.op=='nom')later()}return}
if(t.dataset.sig!==undefined){const fl=t.files[0];if(!fl)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,400/im.width,200/im.height),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(im.width*k));cv.height=Math.max(1,Math.round(im.height*k));const cx=cv.getContext('2d');cx.drawImage(im,0,0,cv.width,cv.height);const id=cx.getImageData(0,0,cv.width,cv.height),px=id.data;for(let i=0;i<px.length;i+=4){const l=(px[i]+px[i+1]+px[i+2])/3;if(l>200)px[i+3]=0}cx.putImageData(id,0,0);cabSet('sig',cv.toDataURL('image/png'));save();render()};im.src=rd.result};rd.readAsDataURL(fl);return}
if(t.dataset.sh){const sh=S.shops[S.shop];if(sh){sh[t.dataset.sh]=t.dataset.sh=='tel'?fmtTel(t.value):t.value;save();if(t.dataset.sh=='mag'||t.dataset.sh=='tel')later()}return}
if(dr){const k=dr.dataset.k;let v=t.type=='date'?t.value:parseDate(t.value);if(v===null){alert('Date non reconnue : saisir jj/mm/aaaa.');later();return}S.v[k]=v;save();later();return}
if(t.dataset.p){if(t.value!==''){const k=t.dataset.p,pf=[...EX,...CL].flatMap(s=>s.f).find(x=>x.t=='p'&&x.tgt==k),x=[...((pf&&pf.lists)||DL).flatMap(a=>a[1]),...S.txt][+t.value];if(x)S.v[k]=(V(k)?V(k)+'\n':'')+x}save();later();return}
const rw=t.closest('.sgr');if(rw){const k=rw.dataset.k,raw=rw.querySelector('input').value.trim().replace(',','.'),x=parseFloat(raw);if(raw===''||isNaN(x)){S.v[k]='';mk(k);save();return}const ng=raw[0]=='-'?true:raw[0]=='+'?false:rw.querySelector('select').value=='-';S.v[k]=x===0?'0.00':(ng?'-':'+')+Math.abs(x).toFixed(2);mk(k);save();later();return}
if(t.dataset.d)S.d[t.dataset.d]=t.checked;
else if(t.dataset.k){const k=t.dataset.k;if(t.type=='checkbox'){const a=new Set(S.v[k]||[]);t.checked?a.add(t.value):a.delete(t.value);S.v[k]=[...a]}else{let v=t.value;const f=fdef(k);if(f&&f.av&&v.trim())v=x10(v);if(f&&(f.sg||f.neg)){const x=parseFloat(v.replace(',','.'));if(!isNaN(x))v=f.neg?(x===0?'0.00':(-Math.abs(x)).toFixed(2)):((x>0?'+':'')+x.toFixed(2))}S.v[k]=v;mk(k)}}
else return;save();later()});
async function share(){const t=$('#rep').innerText,cl=S.rt=='cl',o=S.oph.find(x=>x.n==V((cl?'ka':'a')+'.oph'))||{};
if(navigator.share){try{await navigator.share({title:'Courrier optique',text:t});return}catch(e){}}
location.href=`mailto:${encodeURIComponent(o.m||'')}?subject=${encodeURIComponent('Courrier optique - '+V('a.nom'))}&body=${encodeURIComponent(t.slice(0,1800))}`}
