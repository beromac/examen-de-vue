<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10303A">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>Bilan visuel</title>
<style>
:root{--ink:#10303A;--paper:#F5F7F4;--teal:#2E7D6B;--alert:#B93A0E;--line:#D3DCD7;--mute:#5B6F73;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--ink:#E6EEEC;--paper:#0F1B1E;--teal:#5FC0A8;--alert:#FF9066;--line:#2B3D41;--mute:#93A7AA;color-scheme:dark}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line);z-index:5;padding-top:env(safe-area-inset-top)}
h1{font:700 1.05rem/1.2 Georgia,serif;margin:0;padding:10px 14px 4px}
nav{display:flex}nav button{flex:1;padding:11px 4px;border:0;border-bottom:3px solid transparent;background:none;color:var(--mute);font:600 .95rem system-ui}
nav button.on{color:var(--ink);border-color:var(--teal)}
main{max-width:720px;margin:0 auto;padding:10px 12px 60px}
.bar{display:flex;gap:8px;margin:8px 0}.bar button,.btn{flex:1;padding:10px;border:1px solid var(--teal);background:none;color:var(--ink);border-radius:8px;font:600 .95rem system-ui}
.bar button.on,.btn.p{background:var(--teal);color:#fff}
.al{border-left:4px solid var(--alert);padding:8px 12px;margin:10px 0;background:color-mix(in srgb,var(--alert) 10%,transparent);font-weight:600}
details.st{border-bottom:1px solid var(--line);padding:2px 0}
summary{padding:12px 2px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
details.ok summary:after{content:"✓";color:var(--teal)}
.why{color:var(--mute);margin:0 0 6px;font-size:.92rem}
ol{margin:6px 0 10px;padding-left:22px}li{margin:3px 0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f.w{grid-column:1/-1}
.f span{display:block;font-size:.8rem;color:var(--mute)}
input[type=text],input[type=date],select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);font:inherit}
.ck{display:block;padding:4px 0}.dn{display:block;margin:10px 0 8px;font-weight:600}
.calc{background:color-mix(in srgb,var(--teal) 12%,transparent);padding:8px 10px;border-radius:6px;margin:8px 0;font-size:.93rem}
.note{color:var(--mute);font-size:.82rem;margin-top:18px}
#rep table{width:100%;border-collapse:collapse}#rep td{border-bottom:1px solid var(--line);padding:3px 4px;font-size:.9rem}#rep td:first-child{width:40%;color:var(--mute)}
#rep h2{font:700 1.2rem Georgia,serif;margin:18px 0 0}#rep h3{font-size:1rem;margin:12px 0 2px}
@media print{header,.bar,.noprint,.note{display:none!important}body{background:#fff;color:#000}#rep td{color:#000}main{padding:0}}
</style></head><body>
<header><h1>Bilan visuel</h1><nav>
<button data-t="ex">Examen de vue</button><button data-t="cl">Lentilles</button><button data-t="rp">Compte rendu</button></nav></header>
<main id="m"></main>
<script>
const $=s=>document.querySelector(s);
let S;try{S=JSON.parse(localStorage.getItem('opt'))}catch(e){}
S=S||{v:{},d:{},o:{},tab:'ex',lt:'souple'};
const save=()=>{try{localStorage.setItem('opt',JSON.stringify(S))}catch(e){}};
const V=k=>S.v[k]??'',N=k=>parseFloat(String(V(k)).replace(',','.'));
const has=(k,x)=>(S.v[k]||[]).includes(x);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const q=x=>Math.round(x*4)/4,fm=x=>isNaN(x)?'–':(x>0?'+':'')+x.toFixed(2),vx=F=>F/(1-0.012*F);
const E=['od','og'],U=e=>e.toUpperCase();
const F=(k,l,t='t',o,w)=>({k,l,t,o,w});
const rx=(id,av,add)=>E.flatMap(e=>[F(`${id}.${e}s`,U(e)+' sph','n'),F(`${id}.${e}c`,U(e)+' cyl','n'),F(`${id}.${e}a`,U(e)+' axe °','n'),...(av?[F(`${id}.${e}v`,U(e)+' AV','n')]:[]),...(add?[F(`${id}.${e}d`,U(e)+' addition','n')]:[])]);
const avf=(id)=>['od','og','odg'].flatMap(e=>[F(`${id}.${e}l`,U(e)+' loin','n'),F(`${id}.${e}p`,U(e)+' près','n')]);
const age=()=>N('a.age'),cp=x=>has('a.c',x);
const RF=["Baisse brutale de vision","Flashs / voile / corps flottants récents","Douleur ou rougeur oculaire","Diplopie récente","Traumatisme oculaire"];
const CP=["Flou de loin","Flou de près","Maux de tête","Fatigue visuelle / écrans","Diplopie ancienne ou intermittente","Lignes déformées"];
const pres=()=>age()>=40||cp("Flou de près");
const amp=()=>{const b=N('pr.bn'),o=N('pr.od'),d=b>0?b:o>0?o:NaN;return isNaN(d)?NaN:100/d};
const subAV=()=>E.some(e=>N(`sub.${e}v`)<0.8);
const alerts=()=>{const a=[];RF.filter(x=>has('a.c',x)).forEach(x=>a.push(`Signe d'alerte (${x}) : suspendre le protocole et orienter vers un ophtalmologue, en urgence si le signe est récent.`));if(subAV())a.push("Acuité corrigée < 8/10 : rechercher une cause (trou sténopéique) et orienter vers un examen ophtalmologique si elle persiste.");return a};
const always=()=>true;
const EX=[
{id:'a',t:"1. Anamnèse",w:always,why:"Oriente tout le parcours : les réponses ajoutent ou retirent des tests.",how:["Poser le motif de consultation avec les mots du patient.","Cocher plaintes et signes d'alerte : le parcours s'adapte.","Demander antécédents (diabète, HTA, glaucome familial, chirurgie, traitements), correction actuelle, usage écrans, conduite."],
f:[F('a.nom','Nom, prénom'),F('a.date','Date','d'),F('a.age','Âge','n'),F('a.porte','Correction actuelle','s',['Non','Lunettes','Lentilles']),F('a.c','Plaintes','c',[...CP,...RF]),F('a.ant','Antécédents, traitements, profession','a')]},
{id:'av',t:"2. Acuité visuelle sans correction",w:always,why:"Point de départ chiffré, œil par œil puis binoculaire.",how:["Éclairage standard, tableau à 5 m (ou 3 m avec miroir), patient sans correction.","Occlure l'œil gauche sans appuyer, faire lire l'OD en descendant jusqu'à la plus petite ligne lue, puis l'OG, puis les deux yeux.","Noter l'acuité décimale (ligne dont au moins la moitié des optotypes sont lus).","Répéter à 40 cm pour la vision de près."],f:avf('av')},
{id:'l',t:"3. Lensométrie de la correction portée",w:()=>V('a.porte')=='Lunettes',why:"Référence pour le renouvellement ou l'adaptation.",how:["Poser le verre côté arrière contre l'appui, centrer la mire.","Lire sphère, cylindre, axe, puis la partie près (addition) en visant le point de près.","Noter aussi la date de l'ordonnance et l'ancienneté de l'équipement."],f:[...rx('l',0,1),F('l.ord','Date de l\'ordonnance / équipement')]},
{id:'o',t:"4. Réfraction objective",w:always,why:"Valeur de départ de la réfraction subjective.",how:["Autoréfractomètre : aligner la pupille, 3 mesures par œil, garder la plus cohérente (ou skiascopie).","Noter sphère, cylindre, axe (cylindre négatif).","Si les mesures varient beaucoup, suspecter accommodation ou instabilité, et refaire."],f:rx('o')},
{id:'sub',t:"5. Réfraction subjective : sphère (brouillage)",w:always,why:"Trouve la sphère la plus positive donnant la meilleure acuité.",how:["Partir de la réfraction objective ou de la lensométrie, œil gauche occlus.","Brouiller : ajouter du plus jusqu'à une acuité d'environ 0,3 à 0,5.","Réduire par pas de 0,25 D en demandant « plus net, plus flou, pareil ? » jusqu'à la meilleure acuité.","En cas d'hésitation, garder la sphère la plus positive (ou la moins négative)."],f:rx('sub',1)},
{id:'cyl',t:"6. Affinage du cylindre (cadran + Jackson)",w:()=>E.some(e=>['o','l','sub'].some(p=>Math.abs(N(`${p}.${e}c`))>=.25)),why:"Proposé car un cylindre ≥ 0,25 D est présent.",how:["Cadran horaire : brouillage léger, demander quelle ligne est la plus nette.","Axe du cylindre négatif = le plus petit des deux chiffres de la ligne (en heures) × 30.","Poser le cylindre −0,25 D sur cet axe et ajouter +0,12 de sphère pour garder l'équivalent sphérique.","Cylindres croisés de Jackson : axe du croisé aligné sur l'axe, retourner et choisir la face préférée ; tourner l'axe vers le trait rouge de la face préférée par pas de 5 à 10° jusqu'à équivalence.","Puissance : traits sur l'axe, si le rouge est préféré augmenter le cylindre de −0,25 D (sphère +0,12), si le blanc est préféré le diminuer."],f:[F('cyl.n','Notes cadran / Jackson','a')]},
{id:'bi',t:"7. Test bichrome (rouge/vert)",w:always,why:"Contrôle final de la sphère, œil par œil.",how:["Acuité d'environ 0,5 à 0,8, éclairage normal, un œil à la fois.","« Les lettres sont-elles plus nettes sur le rouge ou sur le vert ? »","Plus net sur le rouge : ajouter du moins (−0,25). Plus net sur le vert : ajouter du plus (+0,25).","S'arrêter à l'équivalence, ou sur un léger avantage du rouge."],f:[F('bi.od','OD résultat','s',['Équilibré','Rouge','Vert']),F('bi.og','OG résultat','s',['Équilibré','Rouge','Vert'])]},
{id:'eq',t:"8. Équilibre binoculaire",w:always,why:"Évite d'avoir un œil plus sur-corrigé que l'autre.",how:["Brouiller les deux yeux (+0,75 D environ) en gardant la même ligne d'acuité.","Utiliser une dissociation prismatique (prisme vertical 3Δ sur un œil) pour voir deux lignes.","Demander quelle ligne est la plus nette ; compenser par +0,25 D sur l'œil dominant jusqu'à égalité.","Ôter le brouillage et vérifier l'acuité binoculaire."],f:[F('eq.n','Résultat, œil dominant','a')]},
{id:'ph',t:"9. Trou sténopéique",w:subAV,why:"Ajouté car l'acuité corrigée est inférieure à 8/10.",how:["Placer le trou devant l'œil testé, aligné sur la pupille.","Si l'acuité remonte : défaut optique résiduel ; si elle ne remonte pas : suspecter une cause organique.","Noter la valeur obtenue et orienter si besoin."],f:[F('ph.od','OD AV avec trou','n'),F('ph.og','OG AV avec trou','n')]},
{id:'pr',t:"10. Presbytie : amplitude d'accommodation",w:pres,why:"Ajouté car âge ≥ 40 ans ou gêne en vision de près. Première estimation de l'addition.",how:["Correction de loin en place, éclairage de lecture, texte fin (Parinaud 2) sur une réglette, œil par œil puis binoculaire.","Méthode push-up : approcher le texte depuis 40 cm jusqu'au premier flou persistant, noter la distance en cm.","Méthode push-down (plus fiable chez le presbyte) : partir très près (flou), reculer jusqu'à la première netteté.","Amplitude (D) = 100 ÷ distance en cm. Comparer à la valeur attendue pour l'âge (Hofstetter).","L'addition de départ se déduit en laissant en réserve la moitié ou le tiers de l'amplitude."],f:[F('pr.dw','Distance de travail (cm)','n'),F('pr.od','OD punctum proximum (cm)','n'),F('pr.og','OG punctum proximum (cm)','n'),F('pr.bn','Binoculaire (cm)','n'),F('pr.n','Notes','a')],
calc:()=>{const a=age(),r=[];if(!isNaN(a)){const x=a<40?0:a<45?.75:a<50?1:a<55?1.5:a<60?2:2.25;r.push(`Repère par l'âge (${a} ans) : addition ${fm(x)} D.`);r.push(`Amplitude attendue : minimum ${Math.max(0,15-.25*a).toFixed(1)} D, moyenne ${Math.max(0,18.5-.3*a).toFixed(1)} D.`)}else r.push("Renseigner l'âge pour obtenir un repère.");[['od','OD'],['og','OG'],['bn','Binoculaire']].forEach(([k,l])=>{const d=N('pr.'+k);if(d>0)r.push(`${l} : amplitude ≈ ${(100/d).toFixed(2)} D.`)});const am=amp();if(!isNaN(am)){const dm=100/(N('pr.dw')>0?N('pr.dw'):40);r.push(`Addition de départ : ${fm(q(Math.max(0,dm-am/2)))} D (réserve de la moitié) ou ${fm(q(Math.max(0,dm-2*am/3)))} D (réserve du tiers).`)}return r.join(' ')}},
{id:'pa',t:"11. Presbytie : addition au cylindre croisé fusionné (Jackson)",w:pres,why:"Affine l'addition en mesurant le retard d'accommodation, œil par œil ou en binoculaire.",how:["Correction de loin finale en place, éclairage de lecture, cible en grille (lignes horizontales et verticales) à 40 cm.","Poser l'addition de départ (étape précédente ou repère par l'âge).","Placer le cylindre croisé de Jackson ±0,50 D devant les yeux, axe négatif (trait rouge) vertical, puis retourner.","Demander : « Les lignes horizontales ou verticales sont-elles plus nettes ? ».","Lignes horizontales plus nettes : ajouter +0,25 D. Lignes verticales plus nettes : retirer 0,25 D. Recommencer jusqu'à l'égalité.","Valeur à l'égalité : addition proposée, à valider en lecture."],f:[F('pa.add','Addition de départ','n'),F('pa.s','Lignes les plus nettes au départ','s',['Horizontales','Verticales','Égales']),F('pa.res','Addition à l\'égalité','n'),F('pa.n','Notes','a')],
calc:()=>{const s=V('pa.s');return s=='Horizontales'?"Retard d'accommodation : ajouter +0,25 D et refaire le test.":s=='Verticales'?"Addition trop forte : retirer 0,25 D et refaire le test.":s=='Égales'?"Égalité : addition validée par le cylindre croisé fusionné.":"Renseigner la ligne la plus nette pour obtenir la conduite à tenir."}},
{id:'pn',t:"12. Presbytie : accommodation relative (NRA / PRA)",w:pres,why:"Contrôle l'addition en cherchant l'équilibre des réserves positive et négative.",how:["Correction de loin et addition provisoire en place, texte à 40 cm, binoculaire.","NRA : ajouter des sphères +0,25 D jusqu'au premier flou soutenu. NRA = total des plus ajoutés.","PRA : revenir à l'addition provisoire, ajouter des sphères −0,25 D jusqu'au premier flou. PRA = total des moins ajoutés.","Valeurs de référence chez l'adulte jeune : NRA ≈ +2,00 D, PRA ≈ −2,37 D (réduites chez le presbyte).","Addition finale = addition provisoire + (NRA − PRA) ÷ 2, avec PRA pris en valeur absolue."],f:[F('pn.add','Addition provisoire','n'),F('pn.nra','NRA (D)','n'),F('pn.pra','PRA (valeur absolue, D)','n')],
calc:()=>{const a=N('pn.add'),n=N('pn.nra'),p=Math.abs(N('pn.pra'));return isNaN(a+n+p)?"Renseigner addition, NRA et PRA pour obtenir l'addition finale.":`Addition finale ≈ ${fm(q(a+(n-p)/2))} D.`}},
{id:'pf',t:"13. Presbytie : plage de netteté et validation",w:pres,why:"Vérifie que l'addition couvre les distances d'usage du patient.",how:["Mettre l'addition retenue, texte fin sur réglette, binoculaire.","Rapprocher le texte jusqu'au premier flou : punctum proximum (PP). L'éloigner jusqu'au premier flou : punctum remotum (PR).","Plage de netteté = PR − PP. Elle doit couvrir la distance de lecture habituelle (par exemple 30 à 60 cm).","PP trop éloigné : augmenter l'addition. PR trop proche : la diminuer.","Valider en situation : lecture d'un texte réel, smartphone, écran. Si l'usage d'écran est important, discuter progressifs ou verres de travail.","Ne différencier OD et OG que si la mesure monoculaire l'impose."],f:[F('pf.pp','PP (cm)','n'),F('pf.pr','PR (cm)','n'),F('pf.od','Addition finale OD','n'),F('pf.og','Addition finale OG','n'),F('pf.n','Notes, usage écrans','a')],
calc:()=>{const a=N('pf.pp'),b=N('pf.pr');return isNaN(a+b)?'':`Plage de netteté : de ${a} à ${b} cm (${(b-a).toFixed(0)} cm).`}},
{id:'bn',t:"14. Vision binoculaire",w:()=>cp("Maux de tête")||cp("Fatigue visuelle / écrans")||cp("Diplopie ancienne ou intermittente")||age()<16,why:"Ajouté car plainte de fatigue, céphalées, diplopie ou patient jeune.",how:["Cover test de loin puis de près : cacher un œil, observer le mouvement de l'œil découvert (tropie), puis cover alterné (phorie).","Punctum proximum de convergence : approcher une cible fine, noter la distance de rupture et de récupération (normal : rupture à 10 cm ou moins).","Stéréoscopie (Lang, Titmus ou Randot) : noter l'acuité stéréoscopique en secondes d'arc.","Si phorie ou convergence insuffisante : prévoir bilan complémentaire (réserves fusionnelles) ou orientation orthoptiste."],f:[F('bn.c','Cover test loin/près'),F('bn.p','PPC (cm)','n'),F('bn.s','Stéréoscopie'),F('bn.n','Notes','a')]},
{id:'am',t:"15. Grille d'Amsler",w:()=>age()>=50||cp("Lignes déformées"),why:"Ajoutée car âge ≥ 50 ans ou lignes déformées.",how:["Grille à 30 cm avec la correction de près, un œil occlus.","Fixer le point central et indiquer lignes déformées, manquantes ou floues.","Toute anomalie : orienter vers un ophtalmologue."],f:[F('am.od','OD','s',['Normal','Anomalie']),F('am.og','OG','s',['Normal','Anomalie'])]},
{id:'co',t:"16. Vision des couleurs",w:()=>age()<16,why:"Ajoutée pour l'enfant.",how:["Planches d'Ishihara à 75 cm, bon éclairage, 3 secondes par planche.","Noter le nombre d'erreurs et le type de déficit suspecté."],f:[F('co.r','Résultat')]},
{id:'fin',t:"17. Acuité finale et essai",w:always,why:"Valide la correction dans les conditions réelles.",how:["Mesurer l'acuité avec la correction finale en loin et en près.","Faire marcher, lire, regarder une surface oblique : l'essai en lunette d'essai de 10 minutes détecte l'inconfort.","Réduire le cylindre ou la différence entre les deux yeux si mauvaise tolérance."],f:avf('fin')},
{id:'cc',t:"18. Conclusion",w:always,why:"Résume la correction retenue et les suites.",how:["Reporter la correction finale (cylindre négatif).","Inscrire conseils, délai de contrôle et orientation éventuelle."],f:[...rx('cc',1,1),F('cc.n','Conclusion, conseils, orientation','a')]}];
const soft=()=>S.lt=='souple';
const comp=e=>{const s=N(`kr.${e}s`),c=N(`kr.${e}c`)||0;if(isNaN(s))return null;const a=vx(s),b=vx(s+c);return{s:q(a),c:q(b-a),a:V(`kr.${e}a`)}};
const kk=e=>{const p=N(`km.${e}p`),c=N(`km.${e}c`);return{p,c,as:337.5/c-337.5/p}};
const adv=()=>{const o=[];if(soft()){const m=V('ke.m'),c=V('ke.c'),v=V('ke.v');if(m=='Nul')o.push("Lentille trop serrée : BC plus plate (+0,3 mm) ou diamètre plus petit.");if(m=='Excessif')o.push("Lentille trop plate : BC plus serrée (−0,3 mm) ou diamètre plus grand.");if(c=='Décentrée'||v=='Incomplète')o.push("Centrage ou couverture insuffisants : diamètre plus grand ou BC plus serrée.");if(m=='Correct'&&c=='Centrée'&&v!='Incomplète'&&v)o.push("Adaptation acceptable : passer à la sur-réfraction.")}else{const f=V('ke.f'),m=V('ke.m'),c=V('ke.c');if(f=='Stagnation centrale')o.push("Trop serrée : BC plus plate de 0,05 mm (règle : plus plat = puissance plus positive, 0,05 mm ≈ 0,25 D).");if(f=='Appui central')o.push("Trop plate : BC plus serrée de 0,05 mm (plus serré = puissance plus négative, 0,05 mm ≈ 0,25 D).");if(m=='Faible'&&f!='Appui central')o.push("Mouvement faible : diamètre plus petit ou BC légèrement plus plate.");if(m=='Excessif')o.push("Mouvement excessif : diamètre plus grand ou BC plus serrée.");if(c=='Basse')o.push("Centrage bas : diamètre plus grand, épaisseur réduite ou BC plus serrée.");if(c=='Haute')o.push("Centrage haut : BC plus serrée ou diamètre plus grand.");if(f=='Alignement'&&m=='Correct'&&c=='Centrée')o.push("Adaptation acceptable : sur-réfraction.")}return o.join(' ')||'Renseigner l\'évaluation pour obtenir une conduite à tenir.'};
const CL=[
{id:'ka',t:"1. Anamnèse lentilles",w:always,why:"Évalue l'indication et les contre-indications.",how:["Demander motivation, usage (journalier, sport, écrans), heures de port souhaitées.","Rechercher sécheresse, allergies, port antérieur et motif d'arrêt.","Évaluer l'hygiène et la dextérité du patient.","Cocher toute contre-indication : suspendre l'adaptation."],f:[F('ka.nom','Nom, prénom'),F('ka.u','Motivation et usage','a'),F('ka.h','Heures de port / jour','n'),F('ka.s','Sécheresse oculaire','s',['Non','Légère','Marquée']),F('ka.hy','Hygiène / dextérité','s',['Bonne','À former']),F('ka.ci','Contre-indications','c',["Infection oculaire active","Œil sec sévère","Allergie oculaire sévère","Pathologie cornéenne","Hygiène impossible"])]},
{id:'kb',t:"2. Biomicroscopie",w:always,why:"Vérifie la santé oculaire avant la pose.",how:["Lampe à fente : paupières et cils, conjonctive, cornée (néovaisseaux, cicatrices), film lacrymal.","Mesurer le temps de rupture lacrymale (BUT) : instiller la fluorescéine, compter les secondes avant la première rupture (normal ≥ 10 s).","Toute anomalie : orienter avant adaptation."],f:[F('kb.p','Paupières / conjonctive'),F('kb.c','Cornée'),F('kb.od','BUT OD (s)','n'),F('kb.og','BUT OG (s)','n')]},
{id:'km',t:"3. Mesures cornéennes",w:always,why:"Base du choix du rayon et du diamètre.",how:["Kératométrie : mesurer rayon plat et rayon serré (mm) pour chaque œil.","Mesurer le diamètre de l'iris visible (HVID) à la règle ou à la lampe.","Noter ouverture palpébrale, diamètre pupillaire et tonicité palpébrale."],f:[F('km.odp','OD K plat (mm)','n'),F('km.odc','OD K serré (mm)','n'),F('km.ogp','OG K plat (mm)','n'),F('km.ogc','OG K serré (mm)','n'),F('km.hvid','HVID (mm)','n'),F('km.op','Ouverture palpébrale (mm)','n'),F('km.pu','Pupille (mm)','n')],
calc:()=>E.map(e=>{const k=kk(e);return isNaN(k.as)?'':`${U(e)} : astigmatisme cornéen ≈ ${k.as.toFixed(2)} D. `}).join('')},
{id:'kr',t:"4. Compensation de la correction",w:always,why:"Calcule la puissance de la lentille à partir de la lunette (distance verre-œil 12 mm).",how:["Reporter la réfraction subjective en cylindre négatif.","L'effet vertex change la puissance dès ±4 D : le calcul est fourni ci-dessous.","Comparer le cylindre réfractif et l'astigmatisme cornéen pour choisir sphérique ou torique."],f:rx('kr'),
calc:()=>E.map(e=>{const c=comp(e);return c?`${U(e)} : ${fm(c.s)} (${fm(c.c)} × ${c.a||'?'}°). `:''}).join('')},
{id:'kp',t:"5. Proposition de lentille d'essai",w:always,why:"Première lentille calculée, à confronter au guide du fabricant.",how:["Choisir dans la gamme du fabricant la lentille la plus proche des valeurs proposées.","Ces valeurs sont des repères : le guide d'adaptation de la marque prime.","Noter la référence réellement posée."],f:E.flatMap(e=>[F(`kp.${e}bc`,U(e)+' BC essai','n'),F(`kp.${e}d`,U(e)+' Ø essai','n'),F(`kp.${e}p`,U(e)+' puissance essai','n')]),
calc:()=>{const h=N('km.hvid');return E.map(e=>{const k=kk(e),c=comp(e);if(isNaN(k.p)||isNaN(h))return'';const tor=c&&Math.abs(c.c)>=.75;if(soft())return`${U(e)} : BC ≈ ${(Math.round((k.p+0.9)*10)/10).toFixed(1)} mm, Ø ≈ ${(Math.round((h+2)*2)/2).toFixed(1)} mm, ${tor?'torique (cylindre ≥ 0,75 D)':'sphérique'}${age()>=45?', multifocale à discuter':''}. `;return`${U(e)} : BC ≈ ${(Math.round(k.p*20)/20).toFixed(2)} mm (alignement sur K plat), Ø ≈ ${(Math.round((h-2.5)*10)/10).toFixed(1)} mm, puissance ≈ ${c?fm(c.s):'–'}${k.as>=2.5?', astigmatisme cornéen ≥ 2,5 D : dos torique ou bitorique à discuter':''}. `}).join('')}},
{id:'ke',t:"6. Pose et évaluation",w:always,why:soft()?"Lentille souple : centrage, mouvement, couverture cornéenne.":"Lentille rigide : fluorescéine, mouvement, centrage.",how:soft()?["Poser la lentille, attendre 15 à 20 minutes (stabilisation).","Centrage : lentille centrée sur la cornée, couverture complète du limbe.","Mouvement au clignement et push-up test : mouvement léger (0,2 à 0,5 mm), le push-up doit rencontrer une légère résistance.","Torique : observer le repère à 6 h ; règle LARS (vu du praticien face au patient) : repère tourné vers la gauche, ajouter des degrés à l'axe ; vers la droite, en retirer."]:["Poser la lentille, attendre 15 minutes (larmoiement).","Instiller la fluorescéine et observer en lumière bleue (filtre jaune) : alignement, stagnation (trop serrée) ou appui central (trop plate).","Mouvement au clignement et centrage : léger mouvement vertical, lentille centrée ou légèrement basse.","Tester la tolérance, puis noter le bord et la cinétique."],
f:soft()?[F('ke.c','Centrage','s',['Centrée','Décentrée']),F('ke.m','Mouvement','s',['Nul','Correct','Excessif']),F('ke.v','Couverture','s',['Complète','Incomplète']),F('ke.n','Confort, repère torique','a')]:[F('ke.f','Fluorescéine','s',['Alignement','Stagnation centrale','Appui central']),F('ke.m','Mouvement','s',['Correct','Faible','Excessif']),F('ke.c','Centrage','s',['Centrée','Haute','Basse']),F('ke.n','Confort, bord','a')],calc:adv},
{id:'ks',t:"7. Sur-réfraction et puissance finale",w:always,why:"Ajuste la puissance de la lentille posée.",how:["Avec la lentille posée et stable, faire la réfraction subjective rapide sur la sphère.","Ajouter la sur-réfraction à la puissance d'essai.","Au-delà de ±4 D, vérifier l'effet vertex."],f:E.map(e=>F(`ks.${e}s`,U(e)+' sur-réfraction sph','n')),
calc:()=>E.map(e=>{const p=N(`kp.${e}p`),s=N(`ks.${e}s`);return isNaN(p)||isNaN(s)?'':`${U(e)} : puissance finale ≈ ${fm(q(p+s))} D${Math.abs(p+s)>=4?' (vérifier le vertex)':''}. `}).join('')},
{id:'kf',t:"8. Formation et suivi",w:always,why:"Garantit la sécurité du port.",how:["Pose et retrait : se laver les mains, vérifier le sens de la lentille, poser sur la cornée, retirer par pincement ou ventouse (rigide).","Entretien : produit unique adapté, étui renouvelé, jamais d'eau du robinet.","Consignes : en cas de rougeur, douleur ou baisse de vision, retirer et consulter sans délai.","Contrôles : environ 1 semaine, puis 1 mois, puis tous les 6 à 12 mois."],f:[F('kf.f','Consignes données','c',["Pose / retrait","Entretien","Durée de port","Signes d'alerte"]),F('kf.r','Prochain contrôle'),F('kf.n','Notes','a')]}];
const fh=f=>{const v=S.v[f.k];let i;
if(f.t=='s')i=`<select data-k="${f.k}"><option></option>${f.o.map(o=>`<option${v==o?' selected':''}>${o}</option>`).join('')}</select>`;
else if(f.t=='c')i=f.o.map(o=>`<label class="ck"><input type="checkbox" data-k="${f.k}" value="${o}"${(v||[]).includes(o)?' checked':''}> ${o}</label>`).join('');
else if(f.t=='a')i=`<textarea data-k="${f.k}" rows="2">${esc(v||'')}</textarea>`;
else i=`<input data-k="${f.k}" type="${f.t=='d'?'date':'text'}"${f.t=='n'?' inputmode="decimal"':''} value="${esc(v||'')}">`;
return`<div class="f${'cas'.includes(f.t)||f.w?' w':''}"><span>${f.l}</span>${i}</div>`};
const sh=s=>`<details class="st${S.d[s.id]?' ok':''}" data-id="${s.id}"${S.o[s.id]?' open':''}><summary>${s.t}</summary><p class="why">${s.why}</p><ol>${s.how.map(h=>`<li>${h}</li>`).join('')}</ol><div class="g">${s.f.map(fh).join('')}</div>${s.calc?`<p class="calc">${s.calc()}</p>`:''}<label class="dn"><input type="checkbox" data-d="${s.id}"${S.d[s.id]?' checked':''}> Étape terminée</label></details>`;
const rep=()=>{const sec=(t,L)=>{const b=L.filter(s=>s.w()).map(s=>{const r=s.f.filter(f=>{const x=V(f.k);return x!==''&&!(Array.isArray(x)&&!x.length)}).map(f=>`<tr><td>${f.l}</td><td>${esc(Array.isArray(V(f.k))?V(f.k).join(', '):V(f.k))}</td></tr>`).join('');const c=s.calc?s.calc():'';return r||c?`<h3>${s.t}</h3>${r?`<table>${r}</table>`:''}${c?`<p>${esc(c)}</p>`:''}`:''}).join('');return b?`<h2>${t}</h2>${b}`:''};
const al=alerts().map(a=>`<div class="al">${a}</div>`).join('');
return`<div id="rep"><h2 style="margin-top:0">Compte rendu : ${esc(V('a.nom')||V('ka.nom')||'patient')}</h2><p>${esc(V('a.date'))}${V('a.age')?' · '+esc(V('a.age'))+' ans':''}</p>${al}${sec("Examen de vue",EX)}${sec("Adaptation en lentilles "+(soft()?'souples':'rigides'),CL)}<p style="margin-top:30px">Signature :</p></div><div class="bar noprint"><button class="btn p" onclick="print()">Imprimer</button><button class="btn" onclick="if(confirm('Effacer le dossier en cours ?')){S={v:{},d:{},o:{},tab:'ex',lt:S.lt};save();render()}">Nouveau dossier</button></div>`};
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==S.tab));
let h='';if(S.tab=='ex')h=alerts().map(a=>`<div class="al">${a}</div>`).join('')+EX.filter(s=>s.w()).map(sh).join('');
if(S.tab=='cl')h=`<div class="bar"><button data-lt="souple" class="${soft()?'on':''}">Souples</button><button data-lt="rigide" class="${soft()?'':'on'}">Rigides</button></div>`+CL.map(s=>(s.w=always,s)).map(s=>{if(s.id=='ke'){s.why=soft()?"Lentille souple : centrage, mouvement, couverture cornéenne.":"Lentille rigide : fluorescéine, mouvement, centrage."}return s}).filter(s=>s.w()).map(sh).join('');
if(S.tab=='rp')h=rep();
h+='<p class="note noprint">Aide-mémoire professionnel : les valeurs sont des repères et ne remplacent ni votre jugement, ni les guides des fabricants, ni le cadre réglementaire applicable.</p>';
$('#m').innerHTML=h}
document.addEventListener('click',e=>{const t=e.target.closest('nav button');if(t){S.tab=t.dataset.t;save();render();scrollTo(0,0)}const l=e.target.closest('[data-lt]');if(l){S.lt=l.dataset.lt;save();render()}});
document.addEventListener('toggle',e=>{if(e.target.dataset&&e.target.dataset.id){S.o[e.target.dataset.id]=e.target.open;save()}},true);
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.d){S.d[t.dataset.d]=t.checked}else if(t.dataset.k){if(t.type=='checkbox'){const a=new Set(S.v[t.dataset.k]||[]);t.checked?a.add(t.value):a.delete(t.value);S.v[t.dataset.k]=[...a]}else S.v[t.dataset.k]=t.value}else return;save();render()});
render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
