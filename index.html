<style>
:root{--ink:#14263A;--paper:#F3F6FA;--card:#fff;--ac:#0E8A7D;--od:#C0392B;--og:#1F6FD1;--odg:#6B4FBB;--line:#D6DEE8;--mute:#5A6B7E;--wa:#B45309;--ok:#15803D;--in:#1D4ED8;--al:#B91C1C;--hd:#14263A;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--ink:#E8EEF5;--paper:#0E1620;--card:#16212E;--ac:#3FC1B0;--od:#FF8A7A;--og:#7DB3FF;--odg:#B7A2FF;--line:#2A3A4D;--mute:#9BADC0;--wa:#F6A04D;--ok:#5FD08A;--in:#8BB4FF;--al:#FF8080;--hd:#0A1119;color-scheme:dark}}
@media print{:root{--ink:#000;--paper:#fff;--card:#fff;--mute:#444;--line:#bbb;--ac:#0E6F65;--od:#9B1C1C;--og:#1646A0;--odg:#4B3590;--wa:#8A3F00;--ok:#14602F;--in:#173E99;--al:#9B1C1C}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.al{border-color:var(--al);color:var(--al)}.wa{border-color:var(--wa);color:var(--wa)}.ok{border-color:var(--ok);color:var(--ok)}.in{border-color:var(--in);color:var(--in)}
details.st{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0;padding:0 12px}

.n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ac);color:#fff;font-style:normal;font-size:.82rem;margin-right:9px}
details.ok .n{background:var(--ok)}details.ok .n:after{content:"✓"}details.ok .n{font-size:0}details.ok .n:after{font-size:.9rem}
.why{color:var(--mute);margin:0 0 6px;font-size:.9rem}
ol{margin:6px 0 10px;padding-left:22px}li{margin:3px 0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f.w{grid-column:1/-1}.f span{display:block;font-size:.78rem;color:var(--mute)}
.eye{border-left:5px solid var(--c);background:color-mix(in srgb,var(--c) 9%,transparent);border-radius:0 10px 10px 0;padding:6px 10px 9px;margin:9px 0}
.eye h4{margin:0 0 4px;color:var(--c);font-size:.88rem}.eye.od{--c:var(--od)}.eye.og{--c:var(--og)}.eye.odg{--c:var(--odg)}
input[type=text],input[type=date],select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);font:inherit;min-width:0}
.ck{display:block;padding:3px 0;font-size:.95rem}.dn{display:block;margin:10px 0 12px;font-weight:600}
.calc{background:color-mix(in srgb,var(--ac) 13%,transparent);padding:8px 10px;border-radius:8px;margin:8px 0;font-size:.92rem}
.row{display:flex;gap:6px;align-items:center;justify-content:space-between;margin:4px 0}.row select{flex:1}
h3{margin:16px 0 4px}.sgr select{flex:0 0 64px;width:64px}.sgr input{flex:1}.note{color:var(--mute);font-size:.8rem;margin-top:18px}
#rep{background:var(--card);padding:14px;border-radius:10px;border:1px solid var(--line)}
#rep h2{font:700 1.15rem Georgia,serif;margin:14px 0 2px;color:var(--ac)}#rep h3{font-size:.98rem;margin:12px 0 2px;color:var(--ac)}
#rep table{width:100%;border-collapse:collapse}#rep td,#rep th{border-bottom:1px solid var(--line);padding:3px 5px;font-size:.88rem;text-align:left;vertical-align:top}#rep td:first-child{width:34%;color:var(--mute)}
#rep .hd2{border-bottom:2px solid var(--ac);padding-bottom:6px;font-size:.9rem}
#rep tr.od td:first-child,#rep tr.od td b{color:var(--od)}#rep tr.og td:first-child,#rep tr.og td b{color:var(--og)}#rep tr.odg td:first-child,#rep tr.odg td b{color:var(--odg)}
#rep .legal{margin-top:16px;font-size:.74rem;color:var(--mute);border-top:1px solid var(--line);padding-top:6px}
@media print{header,.bar,.noprint,.note{display:none!important}body{background:#fff}main{padding:0}#rep{border:0;padding:0}}
</style></head><body>
<header><h1>Bilan visuel</h1><nav>
<button data-t="ex">Examen</button><button data-t="cl">Lentilles</button><button data-t="rp">Compte rendu</button><button data-t="rg">Réglages</button></nav></header>
<main id="m"></main>
<script>
const $=s=>document.querySelector(s);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
let S;try{S=JSON.parse(localStorage.getItem('opt'))}catch(e){}
S=Object.assign({v:{},d:{},o:{},tab:'ex',lt:'souple',rt:'ex',oph:[],cab:{},txt:[]},S||{});
if(!S.v['a.date'])S.v['a.date']=today();
const save=()=>{try{localStorage.setItem('opt',JSON.stringify(S))}catch(e){}};
const V=k=>S.v[k]??'',N=k=>parseFloat(String(V(k)).replace(',','.'));
const has=(k,x)=>(S.v[k]||[]).includes(x);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const q=x=>Math.round(x*4)/4,fm=x=>isNaN(x)?'–':(x>0?'+':'')+x.toFixed(2),vx=F=>F/(1-0.012*F);
const E=['od','og'],U=e=>e.toUpperCase();
const F=(k,l,t='t',o,w,x)=>({k,l,t,o,w,...x});
const SG={sg:1},NG={neg:1};
const PAR=['P1.5','P2','P3','P4','P5','P6','P8','P10','P14','P20'];
const rx=(id,av,add)=>E.flatMap(e=>[F(`${id}.${e}s`,U(e)+' sph','n',0,0,SG),F(`${id}.${e}c`,U(e)+' cyl','n',0,0,NG),F(`${id}.${e}a`,U(e)+' axe °','n'),...(av?[F(`${id}.${e}v`,U(e)+' AV','n')]:[]),...(add?[F(`${id}.${e}d`,U(e)+' addition','n',0,0,SG)]:[])]);
const avf=id=>['od','og','odg'].flatMap(e=>[F(`${id}.${e}l`,U(e)+' loin (décimal)','n'),F(`${id}.${e}p`,U(e)+' près (Parinaud)','s',PAR)]);
const D=s=>s?new Date(s+'T00:00:00'):null;
const fdt=s=>s?s.split('-').reverse().join('/'):'';
const fd=d=>d.toLocaleDateString('fr-FR');
const ageAt=(d,r)=>{if(!d)return NaN;const a=D(d),b=r?D(r):new Date();let y=b.getFullYear()-a.getFullYear();if(b<new Date(b.getFullYear(),a.getMonth(),a.getDate()))y--;return y};
const age=()=>ageAt(V('a.dob'),V('a.date')||today());
const addAge=a=>a<40?0:a<45?.75:a<50?1:a<55?1.5:a<60?2:2.25;
const bizAdd=(s,n)=>{const d=D(s);while(n>0){d.setDate(d.getDate()+1);if(d.getDay()%6)n--}return d};
const cp=x=>has('a.c',x);
const RF=["Baisse brutale de vision","Flashs / voile / corps flottants récents","Douleur ou rougeur oculaire","Diplopie récente","Traumatisme oculaire"];
const CP=["Flou de loin","Flou de près","Maux de tête","Fatigue visuelle / écrans","Diplopie ancienne ou intermittente","Lignes déformées"];
const OPP="Opposition ou limitation d'adaptation mentionnée sur l'ordonnance";
const SIT=["Glaucome ou hypertonie oculaire","Pathologie rétinienne (DMLA, rétinopathie diabétique)","Cataracte","Chirurgie réfractive","Anomalie cornéenne (kératocône, greffe, kératopathie)","Amblyopie bilatérale","Diplopie récente ou évolutive","Traumatisme oculaire sévère de moins de 3 ans","Diabète","Maladie auto-immune","HTA mal contrôlée","Traitement au long cours à risque oculaire"];
const DEM=["RI : renouvellement identique","RA : renouvellement adapté","POM : demande de primo-ordonnance modifiée","Orienter vers l'ophtalmologiste"];
const bestAV=e=>{for(const p of['sc','cyl','sub']){const x=N(`${p}.${e}v`);if(!isNaN(x))return x}return NaN};
const subAV=()=>E.some(e=>bestAV(e)<0.8);
const pres=()=>age()>=40||cp("Flou de près");
const amp=()=>{const b=N('pr.bn'),o=N('pr.od'),d=b>0?b:o>0?o:NaN;return isNaN(d)?NaN:100/d};
const bin=()=>V('a.bin')=='Inclure systématiquement'||age()<16||["Maux de tête","Fatigue visuelle / écrans","Diplopie ancienne ou intermittente"].some(x=>cp(x))||Math.abs(N('sc.ods')-N('sc.ogs'))>=1||V('eq.res')=='Égalité impossible (dominant favorisé)';
const cylNeeded=()=>E.some(e=>['o','l','ord'].some(p=>Math.abs(N(`${p}.${e}c`))>=.25)||N(`sub.${e}v`)<1);
const always=()=>true,soft=()=>S.lt=='souple';
const alerts=()=>{const a=[];RF.filter(x=>has('a.c',x)).forEach(x=>a.push(`Signe d'alerte (${x}) : suspendre le protocole et orienter vers un ophtalmologiste, en urgence si le signe est récent.`));if(subAV())a.push("Acuité corrigée < 8/10 : rechercher une cause (trou sténopéique) et orienter si elle persiste.");return a};

/* ---- Contrôle réglementaire ---- */
const rxv=(p,e)=>({s:N(`${p}.${e}s`),c:N(`${p}.${e}c`)||0,a:N(`${p}.${e}a`),d:N(`${p}.${e}d`)});
const nv=x=>x&&!isNaN(x.s);
const CFX={p:'a',dem:'cc.dem',fin:e=>{const x=rxv('cc',e);return nv(x)?x:rxv('sc',e)},prev:e=>rxv('ord',e)};
const CFL={p:'ka',cl:1,dem:'kf.dem',fin:e=>rxv('kr',e),prev:e=>rxv('ko',e)};
const lppHits=c=>{const P=E.map(e=>({n:c.fin(e),o:c.prev(e)}));if(!P.every(x=>nv(x.n)&&nv(x.o)))return null;const h=[],dS=x=>Math.abs(x.n.s-x.o.s),dC=x=>Math.abs(x.n.c-x.o.c),z=v=>isNaN(v)?0:v;
if(P.some(x=>dS(x)>=.5||dC(x)>=.5)||P.every(x=>dS(x)>=.25||dC(x)>=.25))h.push("variation de sphère ou de cylindre");
if(P.some(x=>z(x.n.d)||z(x.o.d))){if(!P.some(x=>dS(x)>0||dC(x)>0)){const dd=x=>Math.abs(z(x.n.d)-z(x.o.d));if(P.some(x=>dd(x)>=.5)||P.every(x=>dd(x)>=.25))h.push("variation de l'addition")}else if(P.some(x=>dS(x)+Math.abs((x.n.s+z(x.n.d))-(x.o.s+z(x.o.d)))>=.5))h.push("somme des variations de loin et de près")}
P.forEach((x,i)=>{const cy=Math.abs(x.n.c);if(cy&&!isNaN(x.n.a)&&!isNaN(x.o.a)){let d=Math.abs(x.n.a-x.o.a)%180;d=Math.min(d,180-d);if(d>(cy<=1?20:cy<=4?10:5))h.push(`variation de l'axe ${U(E[i])} (${d}°)`)}});return h};
const lg=c=>{let Zn='top';const r=[],A=(t,m)=>r.push([t,m,Zn]),P=c.p,dob=V('a.dob'),dt=V('a.date')||today(),od=V(P+'.ord'),an=age();
const prim=(V(P+'.prim')||'').startsWith('Premi'),opp=has(P+'.opp',OPP);
if(!dob)A('in',"Renseigner la date de naissance pour le contrôle réglementaire.");
if(!od)A('in',"Renseigner la date de l'ordonnance.");
let valid=null,yrs=1;
if(dob&&od){const ap=ageAt(dob,od),dur=c.cl?(prim||an<16?1:3):(ap<16?1:ap<=42?5:3),ex=D(od);ex.setFullYear(ex.getFullYear()+dur);valid=D(dt)<=ex;yrs=(D(dt)-D(od))/31557600000;const y=dur>1?'ans':'an';
A(valid?'ok':'al',c.cl?(valid?`Ordonnance de lentilles dans le délai (${dur} ${y}, jusqu'au ${fd(ex)}) : adaptation possible.`:`Ordonnance de lentilles de plus de ${dur} ${y} (échue le ${fd(ex)}) : adaptation impossible, nouvelle prescription nécessaire.`):(valid?`Ordonnance valide : prescrite à ${ap} ans, validité ${dur} ${y}, jusqu'au ${fd(ex)}.`:`Ordonnance périmée depuis le ${fd(ex)} (prescrite à ${ap} ans, validité ${dur} ${y}) : ni renouvellement identique ni adaptation, nouvelle prescription nécessaire.`))}
if(opp)A('al',"Opposition ou limitation du prescripteur : adaptation interdite, délivrance à l'identique uniquement.");
if(prim)A('wa',c.cl?"Premier port de lentilles : ordonnance médicale obligatoire (validité 1 an). Adaptation seulement avec l'accord écrit du prescripteur (décret n° 2024-617).":"Première délivrance suivant l'ordonnance : adaptation possible uniquement après examen de réfraction ET accord écrit du prescripteur (réponse sous 10 jours ouvrables, réputée favorable à défaut). Sans accord : délivrance à l'identique.");
const sit=V(P+'.sit')||[];if(sit.length)A('wa',`Situation listée par l'arrêté du 25/10/2016 (${sit.join(', ')}) : le prescripteur peut avoir limité l'adaptation. Vérifier l'ordonnance, orienter en cas de doute.`);
const hits=[];let fin=false;E.forEach(e=>{const n=c.fin(e),o=c.prev(e);if(!nv(n))return;fin=true;if(n.s<=-6)hits.push(`${U(e)} : myopie ≥ 6 D`);if(nv(o)){if(Math.max(Math.abs(n.c),Math.abs(o.c))>=.75&&!isNaN(n.a)&&!isNaN(o.a)){let d=Math.abs(n.a-o.a)%180;d=Math.min(d,180-d);if(d>=20)hits.push(`${U(e)} : axe modifié de ${d}° (astigmatisme ≥ 0,75 D)`)}const dv=Math.max(Math.abs(n.s-o.s),Math.abs(n.s+n.c/2-(o.s+o.c/2)));if(dv>=Math.max(1,yrs))hits.push(`${U(e)} : variation de ${dv.toFixed(2)} D par rapport à l'ordonnance`)}});
Zn='cc';if(hits.length)A('wa',`Critères indicatifs de l'arrêté du 25/10/2016 atteints (${hits.join(' ; ')}) : vérifier l'absence de limitation sur l'ordonnance, envisager l'avis de l'ophtalmologiste.`);
Zn='eqp';if(!c.cl&&dob&&(V('a.eqp')||od)){const rd=V('a.eqp')||od,y=ageAt(rd,dt),rf=V('a.eqp')?"dernier équipement":"ordonnance",td=(V(c.dem)||'').slice(0,3);
if(!V('a.eqp'))A('wa',"Prise en charge : date de délivrance du dernier équipement non renseignée, le calcul utilise la date de l'ordonnance (le délai court à partir de la délivrance de l'équipement précédent).");
if(an<16){y>=1?A('ok',"Moins de 16 ans : délai de prise en charge d'1 an atteint."):A('wa',"Moins de 16 ans, moins d'1 an depuis le dernier équipement : renouvellement remboursé seulement si dégradation objectivée par un ophtalmologiste sur une prescription médicale.")}
else if(y>=2)A('ok',"Prise en charge : 2 ans écoulés, renouvellement remboursable.");
else if(y<1)A('al',`Prise en charge : moins d'1 an depuis le ${rf}, renouvellement non remboursable (arrêté du 3/12/2018, VIII.1 et VIII.2).`);
else{Zn='cc';const h=lppHits(c);if(td=='RI ')A('al',"Prise en charge : entre 1 et 2 ans avec correction inchangée, renouvellement anticipé non remboursable (VIII.2 exige une dégradation).");
else if(h===null)A('in',"Entre 1 et 2 ans : renseigner l'ordonnance et la correction finale pour évaluer le renouvellement anticipé (VIII.2).");
else A(h.length?'ok':'al',h.length?`Renouvellement anticipé autorisé (VIII.2) : ${h.join(' ; ')}.`:"Prise en charge : entre 1 et 2 ans, la variation ne remplit aucun critère de l'arrêté du 3/12/2018 (VIII.2) : renouvellement anticipé refusé.")}
Zn='eqp';if(sit.length&&y<2)A('in',"Situation médicale particulière : aucun délai minimal de prise en charge, sous réserve d'une nouvelle prescription ophtalmologique mentionnant le cas.")}
Zn='cc';const t=(V(c.dem)||'').slice(0,3);
if(!t)A('in',"Choisir le type de demande (RI, RA, POM, orientation) pour obtenir le verdict.");
else if(t=='RI '){valid===false?A('al',"RI impossible : ordonnance non valide."):A('ok',"RI possible : délivrance à l'identique de l'ordonnance en cours de validité.")}
else if(t=='RA '){if(valid===false||opp)A('al',"RA NON autorisé au regard de la réglementation (ordonnance non valide ou opposition du prescripteur).");else if(!fin)A('in',"Renseigner la correction finale pour évaluer le RA.");else if(prim)A('wa',"RA conditionné à l'accord écrit du prescripteur (première délivrance).");else if(hits.length)A('wa',"RA possible en droit mais à risque : des critères indicatifs sont atteints.");else A('ok',"RA autorisé au regard des règles d'adaptation (ordonnance valide, pas d'opposition, examen de réfraction réalisé, aucun critère indicatif atteint). La prise en charge se juge séparément (messages ci-dessus).")}
else if(t=='POM')A('in',"POM : transmettre ce compte rendu au prescripteur pour demander l'accord ou une ordonnance modifiée.");
else A('in',"Orientation vers l'ophtalmologiste : transmettre le compte rendu.");
return r};
const lgh=(r,z)=>r.filter(x=>!z||x[2]==z).map(([t,m])=>`<div class="${t}">${m}</div>`).join('');

/* ---- Étapes de l'examen ---- */
const EX=[
{id:'a',t:"Anamnèse et ordonnance",w:always,why:"Identité, ordonnance à renouveler et plaintes : orientent tout le parcours et le contrôle réglementaire.",how:["La date du jour est remplie automatiquement ; saisir la date de naissance (l'âge est calculé).","Choisir l'ophtalmologiste dans la liste (bouton « Ajouter » pour en créer un) et saisir la date de l'ordonnance.","Cocher plaintes, signes d'alerte et situations médicales connues : le parcours s'adapte.","Relever antécédents, traitements, usage des écrans, conduite."],
f:[F('a.nom','Nom, prénom'),F('a.dob','Date de naissance','d'),F('a.date',"Date de l'examen",'d'),F('a.porte','Correction actuelle','s',['Non','Lunettes','Lentilles']),F('a.oph','Ophtalmologiste prescripteur','o'),F('a.ord',"Date de l'ordonnance",'d'),F('a.eqp',"Date de délivrance du dernier équipement (verres)",'d'),F('a.eqpz','','z',null,1,{cfg:CFX,zone:'eqp'}),F('a.prim','Situation','s',["Renouvellement (équipement déjà délivré avec cette ordonnance)","Première délivrance suivant cette ordonnance"],1),F('a.opp','Mention du prescripteur','c',[OPP]),F('a.sit','Situations médicales connues (arrêté du 25/10/2016)','c',SIT),F('a.c','Plaintes et signes d\'alerte','c',[...CP,...RF]),F('a.bin','Bilan binoculaire','s',['Automatique selon les réponses','Inclure systématiquement'],1),F('a.ant','Antécédents, traitements, profession','a')],
calc:()=>{const a=age();return isNaN(a)?"Renseigner la date de naissance : l'âge et l'addition théorique seront calculés.":`Âge : ${a} ans.${a>=40?` Addition théorique indicative : ${fm(addAge(a))} D (à valider par les tests).`:''}`}},
{id:'ord',t:"Ordonnance à renouveler",w:always,why:"Référence du contrôle réglementaire et du compte rendu pour l'ophtalmologiste.",how:["Reporter fidèlement la correction de l'ordonnance (cylindre négatif).","Relever toute mention expresse du prescripteur (opposition, limitation de durée)."],f:[...rx('ord',0,1),F('ord.n',"Mentions de l'ordonnance",'a')]},
{id:'av',t:"Acuité visuelle sans correction",w:always,why:"Point de départ chiffré, œil par œil puis binoculaire.",how:["Éclairage standard, tableau à 5 m (ou 3 m avec miroir), patient sans correction.","Occlure l'œil gauche sans appuyer, faire lire l'OD jusqu'à la plus petite ligne lue, puis l'OG, puis les deux yeux.","Noter l'acuité décimale (ligne dont au moins la moitié des optotypes sont lus).","Près : échelle de Parinaud à 40 cm, noter le plus petit paragraphe lu couramment."],f:avf('av')},
{id:'l',t:"Lensométrie de la correction portée",w:()=>V('a.porte')=='Lunettes',why:"Référence pour le renouvellement ou l'adaptation.",how:["Poser le verre côté arrière contre l'appui, centrer la mire.","Lire sphère, cylindre, axe, puis l'addition en visant le point de près."],f:[...rx('l',0,1)]},
{id:'o',t:"Réfraction objective",w:always,why:"Valeur de départ de la réfraction subjective.",how:["Autoréfractomètre : aligner la pupille, 3 mesures par œil, garder la plus cohérente (ou skiascopie).","Noter sphère, cylindre (négatif, signe automatique), axe.","Mesures très variables : suspecter accommodation ou instabilité, refaire."],f:rx('o')},
{id:'sub',t:"Réfraction subjective : sphère seule",w:always,why:"Premier temps : on travaille uniquement la sphère, sans toucher au cylindre.",how:["Placer la sphère de départ sans cylindre (réfraction objective, lensométrie ou sphère équivalente), œil gauche occlus.","Brouiller : ajouter du plus jusqu'à une acuité d'environ 0,3 à 0,5.","Réduire par pas de 0,25 D en demandant « plus net, plus flou, pareil ? » jusqu'à la meilleure acuité.","En cas d'hésitation, garder la sphère la plus positive."],f:E.flatMap(e=>[F(`sub.${e}s`,U(e)+' sph','n',0,0,SG),F(`sub.${e}v`,U(e)+' AV','n')])},
{id:'cyl',t:"Réfraction subjective : cylindre et axage",w:always,why:"Deuxième temps : sphère figée, on cherche le cylindre et son axe, même si aucun cylindre n'a été détecté à l'objectif (cylindre 0 si rien n'améliore l'acuité).",how:["Cadran horaire : brouillage léger, demander quelle ligne est la plus nette.","Axe du cylindre négatif = le plus petit des deux chiffres de la ligne (en heures) × 30.","Poser le cylindre −0,25 D sur cet axe et ajouter +0,12 de sphère pour garder l'équivalent sphérique.","Croix de Jackson : axe du croisé aligné sur l'axe, retourner, choisir la face préférée ; tourner l'axe vers le trait rouge de la face préférée par pas de 5 à 10° jusqu'à équivalence.","Puissance : traits sur l'axe ; rouge préféré = augmenter le cylindre de −0,25 D (sphère +0,12), blanc préféré = le diminuer."],f:E.flatMap(e=>[F(`cyl.${e}c`,U(e)+' cyl','n',0,0,NG),F(`cyl.${e}a`,U(e)+' axe °','n'),F(`cyl.${e}v`,U(e)+' AV','n')])},
{id:'sc',t:"Réfraction subjective : sphère + cylindre",w:always,why:"Troisième temps : on recombine et on affine les deux ensemble.",how:["Reprendre la sphère et le cylindre avec son axe trouvés aux deux étapes précédentes.","Re-contrôler la sphère avec le cylindre en place (petit brouillage puis réduction par 0,25 D).","Vérifier une dernière fois axe et puissance du cylindre à la croix de Jackson.","Noter la correction finale œil par œil (cylindre négatif) et l'acuité."],f:rx('sc',1),x:()=>`<button class="btn noprint" data-act="fill" data-to="sc">Reprendre sphère et cylindre des étapes précédentes</button>`},
{id:'bi',t:"Test bichrome (rouge/vert)",w:always,why:"Contrôle final de la sphère, œil par œil.",how:["Acuité d'environ 0,5 à 0,8, éclairage normal, un œil à la fois.","« Les lettres sont-elles plus nettes sur le rouge ou sur le vert ? »","Plus net sur le rouge : ajouter du moins (−0,25). Plus net sur le vert : ajouter du plus (+0,25).","S'arrêter à l'équivalence, ou sur un léger avantage du rouge."],f:E.map(e=>F(`bi.${e}`,U(e)+' résultat','s',['Équilibré','Rouge','Vert']))},
{id:'eq',t:"Équilibre binoculaire et œil dominant",w:always,why:"Évite qu'un œil soit sur-corrigé par rapport à l'autre.",how:["Œil dominant : test de Porta (bras tendu, pouce sur une cible lointaine, les deux yeux ouverts, fermer un œil puis l'autre : l'œil pour lequel le pouce reste sur la cible est dominant), contrôle par le trou dans une carte.","Brouiller les deux yeux (+0,75 D environ) en gardant la même ligne d'acuité.","Dissociation prismatique (prisme vertical 3Δ sur un œil) pour voir deux lignes superposées.","Demander quelle ligne est la plus nette ; ajouter +0,25 D sur l'œil de la ligne la plus nette jusqu'à égalité.","Égalité impossible : laisser l'œil dominant légèrement plus net (sphère la moins positive qui garde la meilleure acuité).","Ôter le brouillage, vérifier l'acuité binoculaire."],f:[F('eq.dom','Œil dominant','s',['OD','OG','Pas de dominance nette']),F('eq.res','Résultat','s',['Égalité obtenue','Ajout de +0,25 sur OD','Ajout de +0,25 sur OG','Égalité impossible (dominant favorisé)'])],
calc:()=>{const d=V('eq.dom'),r=V('eq.res'),a=[];if(d=='OD'||d=='OG')a.push(`Œil dominant : ${d}, à garder le plus net.`);if(r.startsWith('Ajout'))a.push(`Reporter ${r.slice(10)} sur la sphère puis revérifier l'acuité.`);if(r.startsWith('Égalité imp'))a.push("Favoriser l'œil dominant, noter l'écart et réaliser le bilan binoculaire.");return a.join(' ')}},
{id:'ph',t:"Trou sténopéique",w:subAV,why:"Ajouté car l'acuité corrigée est inférieure à 8/10.",how:["Placer le trou devant l'œil testé, aligné sur la pupille.","Acuité qui remonte : défaut optique résiduel. Qui ne remonte pas : suspecter une cause organique.","Noter la valeur et orienter si besoin."],f:E.map(e=>F(`ph.${e}`,U(e)+' AV avec trou','n'))},
{id:'pr',t:"Presbytie : amplitude d'accommodation",w:pres,why:"Ajouté car âge ≥ 40 ans ou gêne de près. Première estimation de l'addition.",how:["Correction de loin en place, éclairage de lecture, texte fin (Parinaud 2) sur réglette, œil par œil puis binoculaire.","Push-up : approcher le texte depuis 40 cm jusqu'au premier flou persistant, noter la distance en cm.","Push-down (plus fiable chez le presbyte) : partir très près, reculer jusqu'à la première netteté.","Amplitude (D) = 100 ÷ distance en cm, à comparer à la valeur attendue pour l'âge (Hofstetter).","L'addition de départ se déduit en laissant en réserve la moitié ou le tiers de l'amplitude."],f:[F('pr.dw','Distance de travail (cm)','n'),F('pr.od','OD punctum proximum (cm)','n'),F('pr.og','OG punctum proximum (cm)','n'),F('pr.bn','ODG punctum proximum (cm)','n'),F('pr.n','Notes','a')],
calc:()=>{const a=age(),r=[];if(!isNaN(a)){r.push(`Repère par l'âge (${a} ans) : addition ${fm(addAge(a))} D.`);r.push(`Amplitude attendue : minimum ${Math.max(0,15-.25*a).toFixed(1)} D, moyenne ${Math.max(0,18.5-.3*a).toFixed(1)} D.`)}[['od','OD'],['og','OG'],['bn','Binoculaire']].forEach(([k,l])=>{const d=N('pr.'+k);if(d>0)r.push(`${l} : amplitude ≈ ${(100/d).toFixed(2)} D.`)});const am=amp();if(!isNaN(am)){const dm=100/(N('pr.dw')>0?N('pr.dw'):40);r.push(`Addition de départ : ${fm(q(Math.max(0,dm-am/2)))} D (réserve de la moitié) ou ${fm(q(Math.max(0,dm-2*am/3)))} D (réserve du tiers).`)}return r.join(' ')}},
{id:'pa',t:"Presbytie : cylindre croisé fusionné (Jackson)",w:pres,why:"Affine l'addition en mesurant le retard d'accommodation.",how:["Correction de loin finale en place, éclairage de lecture, cible en grille (lignes horizontales et verticales) à 40 cm.","Poser l'addition de départ.","Placer le cylindre croisé ±0,50 D, axe négatif (trait rouge) vertical, puis retourner.","« Les lignes horizontales ou verticales sont-elles plus nettes ? »","Horizontales plus nettes : ajouter +0,25 D. Verticales plus nettes : retirer 0,25 D. Recommencer jusqu'à l'égalité.","La valeur à l'égalité est l'addition proposée, à valider en lecture."],f:[F('pa.add','Addition de départ','n',0,0,SG),F('pa.s','Lignes les plus nettes au départ','s',['Horizontales','Verticales','Égales']),F('pa.res',"Addition à l'égalité",'n',0,0,SG)],
calc:()=>{const s=V('pa.s');return s=='Horizontales'?"Retard d'accommodation : ajouter +0,25 D et refaire le test.":s=='Verticales'?"Addition trop forte : retirer 0,25 D et refaire le test.":s=='Égales'?"Égalité : addition validée par le cylindre croisé fusionné.":"Renseigner la ligne la plus nette pour obtenir la conduite à tenir."}},
{id:'pn',t:"Presbytie : accommodation relative (NRA / PRA)",w:pres,why:"Contrôle l'addition par l'équilibre des réserves.",how:["Correction de loin et addition provisoire en place, texte à 40 cm, binoculaire.","NRA : ajouter des sphères +0,25 D jusqu'au premier flou soutenu. NRA = total des plus ajoutés.","PRA : revenir à l'addition provisoire, ajouter des sphères −0,25 D jusqu'au premier flou. PRA = total des moins ajoutés.","Repères adulte jeune : NRA ≈ +2,00 D, PRA ≈ −2,37 D (réduits chez le presbyte).","Addition finale = addition provisoire + (NRA − PRA) ÷ 2, PRA en valeur absolue."],f:[F('pn.add','Addition provisoire','n',0,0,SG),F('pn.nra','NRA (D)','n'),F('pn.pra','PRA (valeur absolue, D)','n')],
calc:()=>{const a=N('pn.add'),n=N('pn.nra'),p=Math.abs(N('pn.pra'));return isNaN(a+n+p)?"Renseigner addition, NRA et PRA pour obtenir l'addition finale.":`Addition finale ≈ ${fm(q(a+(n-p)/2))} D.`}},
{id:'pf',t:"Presbytie : plage de netteté et validation",w:pres,why:"Vérifie que l'addition couvre les distances d'usage.",how:["Addition retenue en place, texte fin sur réglette, binoculaire.","Rapprocher le texte jusqu'au premier flou : punctum proximum (PP). L'éloigner jusqu'au premier flou : punctum remotum (PR).","Plage de netteté = PR − PP, elle doit couvrir la distance habituelle (par exemple 30 à 60 cm).","PP trop éloigné : augmenter l'addition. PR trop proche : la diminuer.","Valider en situation : texte réel, smartphone, écran."],f:[F('pf.od','OD addition finale','n',0,0,SG),F('pf.og','OG addition finale','n',0,0,SG),F('pf.pp','ODG PP (cm)','n'),F('pf.pr','ODG PR (cm)','n'),F('pf.n','Notes, usage écrans','a')],
calc:()=>{const a=N('pf.pp'),b=N('pf.pr');return isNaN(a+b)?'':`Plage de netteté : de ${a} à ${b} cm (${(b-a).toFixed(0)} cm).`}},
{id:'bn',t:"Vision binoculaire : motilité, cover test, convergence",w:bin,why:"Ajouté car plainte de fatigue, céphalées, diplopie, jeune âge, anisométropie ou équilibre difficile (ou demandé dans l'anamnèse).",how:["Motilité : suivre une cible en H à 40 cm, noter limitation, nystagmus, douleur, diplopie.","Cover test de loin (5 m) puis de près (40 cm) : cacher un œil, observer l'œil découvert (tropie), puis cover alterné pour la phorie.","Œil qui bouge vers l'intérieur : exo ; vers l'extérieur : éso ; vers le bas : hyper.","PPC : approcher une cible fine dans l'axe, noter la distance de rupture (l'œil dévie) et de récupération (rupture environ 5 à 10 cm)."],f:[F('bn.cl','Cover test de loin','s',['Orthophorie','Exophorie','Ésophorie','Hyperphorie','Exotropie','Ésotropie','Hypertropie']),F('bn.cp','Cover test de près','s',['Orthophorie','Exophorie','Ésophorie','Hyperphorie','Exotropie','Ésotropie','Hypertropie']),F('bn.mot','Motilité','s',['Normale','Limitée','Douloureuse ou diplopie']),F('bn.rup','PPC rupture (cm)','n'),F('bn.rec','PPC récupération (cm)','n'),F('bn.n','Notes','a')],
calc:()=>N('bn.rup')>10?"PPC éloigné : suspecter une insuffisance de convergence.":''},
{id:'bs',t:"Vision binoculaire : fusion et stéréoscopie",w:bin,why:"Vérifie la fusion, la suppression et le relief.",how:["Test de Worth (4 points) avec lunettes rouge devant l'OD et vert devant l'OG, de loin puis de près.","4 points : fusion. 5 points : diplopie. 2 points rouges : suppression OG. 3 points verts : suppression OD.","Stéréoscopie (Lang, Titmus ou Randot) à 40 cm avec la correction de près, lunettes polarisantes.","Noter l'acuité stéréoscopique en secondes d'arc (normale : 60″ ou moins)."],f:[F('bs.wl','Worth de loin','s',['4 points (fusion)','5 points (diplopie)','2 points rouges (suppression OG)','3 points verts (suppression OD)']),F('bs.wp','Worth de près','s',['4 points (fusion)','5 points (diplopie)','2 points rouges (suppression OG)','3 points verts (suppression OD)']),F('bs.t','Test utilisé','s',['Lang','Titmus','Randot']),F('bs.st','Stéréoacuité (secondes d\'arc)','n')],
calc:()=>N('bs.st')>100?"Stéréoacuité diminuée : rechercher une cause, orienter si absente ou anormale.":''},
{id:'bp',t:"Vision binoculaire : phories et réserves fusionnelles",w:bin,why:"Chiffre la phorie et vérifie la capacité de compensation (critère de Sheard).",how:["Phories dissociées (Maddox, Thorington ou croix de von Graefe) avec la correction finale, de loin puis de près.","Réserves fusionnelles à la distance symptomatique (souvent 40 cm) : BT pour la convergence, BN pour la divergence.","Augmenter les prismes lentement : flou, rupture (diplopie), puis récupération.","Critère de Sheard : la réserve opposée à la phorie (rupture) doit valoir au moins deux fois la phorie. Exophorie : réserve BT. Ésophorie : réserve BN."],f:[F('bp.tl','Phorie de loin','s',['Orthophorie','Exophorie','Ésophorie']),F('bp.vl','Valeur de loin (Δ)','n'),F('bp.tp','Phorie de près','s',['Orthophorie','Exophorie','Ésophorie']),F('bp.vp','Valeur de près (Δ)','n'),F('bp.btr','BT rupture (Δ)','n'),F('bp.btc','BT récupération (Δ)','n'),F('bp.bnr','BN rupture (Δ)','n'),F('bp.bnc','BN récupération (Δ)','n'),F('bp.n','Notes','a')],
calc:()=>{const t=V('bp.tp'),v=Math.abs(N('bp.vp'));if(isNaN(v)||!t||t=='Orthophorie')return'';const r=t=='Exophorie'?N('bp.btr'):N('bp.bnr');if(isNaN(r))return'Renseigner la réserve opposée pour appliquer le critère de Sheard.';return r>=2*v?`Critère de Sheard respecté (réserve ${r}Δ ≥ ${2*v}Δ).`:`Critère de Sheard non respecté (réserve ${r}Δ < ${2*v}Δ) : envisager exercices, prisme ou orientation orthoptiste.`}},
{id:'bf',t:"Vision binoculaire : flexibilité accommodative",w:bin,why:"Évalue la souplesse de l'accommodation.",how:["Flippers ±2,00 D, cible de lecture à 40 cm.","Compter les cycles complets (+ puis −) pendant 1 minute, œil par œil puis binoculaire.","Repère adulte jeune : environ 8 à 11 cycles par minute.","Difficulté avec les +2,00 : excès d'accommodation. Difficulté avec les −2,00 : insuffisance."],f:[F('bf.od','OD cycles/min','n'),F('bf.og','OG cycles/min','n'),F('bf.bn','ODG cycles/min','n'),F('bf.d','Difficulté','s',['Aucune','Avec les +2,00 (excès)','Avec les −2,00 (insuffisance)'],1)],
calc:()=>N('bf.bn')<8?"Flexibilité réduite : rechercher un trouble accommodatif.":''},
{id:'am',t:"Grille d'Amsler",w:()=>age()>=50||cp("Lignes déformées"),why:"Ajoutée car âge ≥ 50 ans ou lignes déformées.",how:["Grille à 30 cm avec la correction de près, un œil occlus.","Fixer le point central, indiquer lignes déformées, manquantes ou floues.","Toute anomalie : orienter vers un ophtalmologiste."],f:E.map(e=>F(`am.${e}`,U(e)+' résultat','s',['Normal','Anomalie']))},
{id:'co',t:"Vision des couleurs",w:()=>age()<16,why:"Ajoutée pour l'enfant.",how:["Planches d'Ishihara à 75 cm, bon éclairage, 3 secondes par planche.","Noter le nombre d'erreurs et le type de déficit suspecté."],f:[F('co.r','Résultat')]},
{id:'fin',t:"Acuité finale et essai",w:always,why:"Valide la correction dans les conditions réelles.",how:["Mesurer l'acuité avec la correction finale en loin et en près (Parinaud).","Faire marcher, lire, regarder une surface oblique : l'essai de 10 minutes détecte l'inconfort.","Réduire le cylindre ou l'écart entre les deux yeux si mauvaise tolérance."],f:avf('fin')},
{id:'cc',t:"Conclusion et type de demande",w:always,why:"Fixe la correction retenue et la démarche : RI, RA, POM ou orientation.",how:["Choisir le type de demande : le contrôle réglementaire donne son verdict en haut de page.","Reporter la correction retenue (cylindre négatif).","Si une adaptation est faite : la reporter sur l'ordonnance (nom, prénom, qualité, identifiant, date, signature) et informer le prescripteur de façon confidentielle.","POM ou première délivrance : noter la date d'envoi de la demande d'accord."],
f:[F('cc.dem','Type de demande','s',DEM,1),F('cc.z','','z',null,1,{cfg:CFX,zone:'cc'}),...rx('cc',1,1),F('cc.env',"Date d'envoi de la demande d'accord",'d'),F('cc.acc','Réponse du prescripteur','s',['En attente','Accord écrit reçu','Pas de réponse sous 10 jours ouvrables (réputé favorable)','Refus ou opposition']),F('cc.p','Texte type (liste déroulante)','p',null,1,{tgt:'cc.n'}),F('cc.n',"Conclusion, conseils, motif d'orientation",'a')],
x:()=>`<button class="btn noprint" data-act="fill" data-to="cc">Reprendre la réfraction finale et l'addition</button>`,
calc:()=>{const e=V('cc.env');return e?`Demande envoyée le ${fdt(e)} : réponse attendue avant le ${fd(bizAdd(e,10))} (10 jours ouvrables ; sans réponse l'accord est réputé favorable).`:''}}];

/* ---- Étapes lentilles ---- */
const comp=e=>{const s=N(`kr.${e}s`),c=N(`kr.${e}c`)||0;if(isNaN(s))return null;const a=vx(s),b=vx(s+c);return{s:q(a),c:q(b-a),a:V(`kr.${e}a`)}};
const kk=e=>{const p=N(`km.${e}p`),c=N(`km.${e}c`);return{p,c,as:337.5/c-337.5/p}};
const adv=()=>{const o=[];const m=V('ke.m'),c=V('ke.c');if(soft()){const v=V('ke.v');if(m=='Nul')o.push("Lentille trop serrée : BC plus plate (+0,3 mm) ou diamètre plus petit.");if(m=='Excessif')o.push("Lentille trop plate : BC plus serrée (−0,3 mm) ou diamètre plus grand.");if(c=='Décentrée'||v=='Incomplète')o.push("Centrage ou couverture insuffisants : diamètre plus grand ou BC plus serrée.");if(m=='Correct'&&c=='Centrée'&&v=='Complète')o.push("Adaptation acceptable : passer à la sur-réfraction.")}else{const f=V('ke.f');if(f=='Stagnation centrale')o.push("Trop serrée : BC plus plate de 0,05 mm (plus plat = puissance plus positive, 0,05 mm ≈ 0,25 D).");if(f=='Appui central')o.push("Trop plate : BC plus serrée de 0,05 mm (plus serré = puissance plus négative, 0,05 mm ≈ 0,25 D).");if(m=='Faible'&&f!='Appui central')o.push("Mouvement faible : diamètre plus petit ou BC légèrement plus plate.");if(m=='Excessif')o.push("Mouvement excessif : diamètre plus grand ou BC plus serrée.");if(c=='Basse')o.push("Centrage bas : diamètre plus grand, épaisseur réduite ou BC plus serrée.");if(c=='Haute')o.push("Centrage haut : BC plus serrée ou diamètre plus grand.");if(f=='Alignement'&&m=='Correct'&&c=='Centrée')o.push("Adaptation acceptable : sur-réfraction.")}return o.join(' ')||"Renseigner l'évaluation pour obtenir une conduite à tenir."};
const CL=[
{id:'ka',t:"Anamnèse et ordonnance de lentilles",w:always,why:"Évalue l'indication, les contre-indications et le cadre réglementaire.",how:["Date du jour automatique ; nom et naissance sont partagés avec l'examen.","Choisir l'ophtalmologiste et saisir la date de l'ordonnance de lentilles.","Demander motivation, usage, heures de port, sécheresse, allergies, port antérieur.","Évaluer hygiène et dextérité ; cocher toute contre-indication : suspendre l'adaptation."],
f:[F('a.nom','Nom, prénom'),F('a.dob','Date de naissance','d'),F('a.date',"Date de l'examen",'d'),F('ka.oph','Ophtalmologiste prescripteur','o'),F('ka.ord',"Date de l'ordonnance de lentilles",'d'),F('ka.prim','Situation','s',['Renouvellement','Premier port de lentilles'],1),F('ka.opp','Mention du prescripteur','c',[OPP]),F('ka.sit','Situations médicales connues (arrêté du 25/10/2016)','c',SIT),F('ka.u','Motivation et usage','a'),F('ka.h','Heures de port / jour','n'),F('ka.s','Sécheresse oculaire','s',['Non','Légère','Marquée']),F('ka.hy','Hygiène / dextérité','s',['Bonne','À former']),F('ka.ci','Contre-indications','c',["Infection oculaire active","Œil sec sévère","Allergie oculaire sévère","Pathologie cornéenne","Hygiène impossible"])]},
{id:'ko',t:"Ordonnance de lentilles à renouveler",w:always,why:"Référence du contrôle réglementaire.",how:["Reporter la correction prescrite (cylindre négatif) et les caractéristiques de la lentille."],f:[...rx('ko',0,1),F('ko.n','Caractéristiques prescrites (marque, BC, diamètre)','a')]},
{id:'kb',t:"Biomicroscopie",w:always,why:"Vérifie la santé oculaire avant la pose.",how:["Lampe à fente : paupières et cils, conjonctive, cornée (néovaisseaux, cicatrices), film lacrymal.","Temps de rupture lacrymale (BUT) : instiller la fluorescéine, compter les secondes avant la première rupture (normal : 10 s ou plus).","Toute anomalie : orienter avant adaptation."],f:[F('kb.p','Paupières / conjonctive'),F('kb.c','Cornée'),F('kb.od','OD BUT (s)','n'),F('kb.og','OG BUT (s)','n')]},
{id:'km',t:"Mesures cornéennes",w:always,why:"Base du choix du rayon et du diamètre.",how:["Kératométrie : rayon plat et rayon serré (mm) pour chaque œil.","Mesurer le diamètre de l'iris visible (HVID).","Noter ouverture palpébrale, pupille et tonicité palpébrale."],f:[F('km.odp','OD K plat (mm)','n'),F('km.odc','OD K serré (mm)','n'),F('km.ogp','OG K plat (mm)','n'),F('km.ogc','OG K serré (mm)','n'),F('km.hvid','HVID (mm)','n'),F('km.op','Ouverture palpébrale (mm)','n'),F('km.pu','Pupille (mm)','n')],
calc:()=>E.map(e=>{const k=kk(e);return isNaN(k.as)?'':`${U(e)} : astigmatisme cornéen ≈ ${k.as.toFixed(2)} D. `}).join('')},
{id:'kr',t:"Compensation de la correction",w:always,why:"Calcule la puissance de la lentille à partir de la lunette (12 mm de distance verre-œil).",how:["Reporter la réfraction subjective en cylindre négatif.","L'effet vertex change la puissance dès ±4 D : le calcul est fourni.","Comparer cylindre réfractif et astigmatisme cornéen pour choisir sphérique ou torique."],f:rx('kr'),
calc:()=>E.map(e=>{const c=comp(e);return c?`${U(e)} : ${fm(c.s)} (${fm(c.c)} × ${c.a||'?'}°). `:''}).join('')},
{id:'kp',t:"Proposition de lentille d'essai",w:always,why:"Première lentille calculée, à confronter au guide du fabricant.",how:["Choisir dans la gamme du fabricant la lentille la plus proche.","Ces valeurs sont des repères : le guide de la marque prime.","Noter la référence réellement posée."],f:E.flatMap(e=>[F(`kp.${e}bc`,U(e)+' BC essai','n'),F(`kp.${e}d`,U(e)+' Ø essai','n'),F(`kp.${e}p`,U(e)+' puissance essai','n',0,0,SG)]),
calc:()=>{const h=N('km.hvid');return E.map(e=>{const k=kk(e),c=comp(e);if(isNaN(k.p)||isNaN(h))return'';const tor=c&&Math.abs(c.c)>=.75;if(soft())return`${U(e)} : BC ≈ ${(Math.round((k.p+0.9)*10)/10).toFixed(1)} mm, Ø ≈ ${(Math.round((h+2)*2)/2).toFixed(1)} mm, ${tor?'torique (cylindre ≥ 0,75 D)':'sphérique'}${age()>=45?', multifocale à discuter':''}. `;return`${U(e)} : BC ≈ ${(Math.round(k.p*20)/20).toFixed(2)} mm (alignement sur K plat), Ø ≈ ${(Math.round((h-2.5)*10)/10).toFixed(1)} mm, puissance ≈ ${c?fm(c.s):'–'}${k.as>=2.5?', astigmatisme cornéen ≥ 2,5 D : dos torique ou bitorique à discuter':''}. `}).join('')}},
{id:'ke',t:"Pose et évaluation",w:always,
get why(){return soft()?"Lentille souple : centrage, mouvement, couverture cornéenne.":"Lentille rigide : fluorescéine, mouvement, centrage."},
get how(){return soft()?["Poser la lentille, attendre 15 à 20 minutes (stabilisation).","Centrage : lentille centrée, couverture complète du limbe.","Mouvement au clignement et push-up test : léger mouvement (0,2 à 0,5 mm), légère résistance au push-up.","Torique : observer le repère à 6 h ; règle LARS (vu du praticien face au patient) : repère tourné vers la gauche, ajouter des degrés à l'axe ; vers la droite, en retirer."]:["Poser la lentille, attendre 15 minutes (larmoiement).","Fluorescéine en lumière bleue (filtre jaune) : alignement, stagnation (trop serrée) ou appui central (trop plate).","Mouvement au clignement et centrage : léger mouvement vertical, centrée ou légèrement basse.","Tester la tolérance, noter le bord et la cinétique."]},
get f(){return soft()?[F('ke.c','Centrage','s',['Centrée','Décentrée']),F('ke.m','Mouvement','s',['Nul','Correct','Excessif']),F('ke.v','Couverture','s',['Complète','Incomplète']),F('ke.n','Confort, repère torique','a')]:[F('ke.f','Fluorescéine','s',['Alignement','Stagnation centrale','Appui central']),F('ke.m','Mouvement','s',['Correct','Faible','Excessif']),F('ke.c','Centrage','s',['Centrée','Haute','Basse']),F('ke.n','Confort, bord','a')]},calc:adv},

{id:'kf',t:"Formation, suivi et type de demande",w:always,why:"Garantit la sécurité du port et fixe la démarche réglementaire.",how:["Pose et retrait : mains lavées, vérifier le sens, poser sur la cornée, retirer par pincement ou ventouse (rigide).","Entretien : produit unique adapté, étui renouvelé, jamais d'eau du robinet.","Rougeur, douleur ou baisse de vision : retirer et consulter sans délai.","Contrôles : environ 1 semaine, 1 mois, puis tous les 6 à 12 mois.","Choisir le type de demande : le verdict réglementaire s'affiche en haut de page."],f:[F('kf.dem','Type de demande','s',DEM,1),F('kf.z','','z',null,1,{cfg:CFL,zone:'cc'}),F('kf.f','Consignes données','c',["Pose / retrait","Entretien","Durée de port","Signes d'alerte"]),F('kf.r','Prochain contrôle'),F('kf.n','Notes','a')]}];

const eyeOf=f=>{const m=/^(OD|OG|ODG)( |$)/.exec(f.l);return m?m[1].toLowerCase():null};

if(f.t=='s')i=`<select data-k="${f.k}"><option></option>${f.o.map(o=>`<option${v==o?' selected':''}>${o}</option>`).join('')}</select>`;
else if(f.t=='o')i=`<div class="row"><select data-k="${f.k}"><option></option>${S.oph.map(o=>`<option${v==o.n?' selected':''}>${esc(o.n)}</option>`).join('')}</select><button class="mini" type="button" data-addoph="${f.k}">+ Ajouter</button></div>`;

else if(f.t=='p'){let n=0;const og=(t,a)=>`<optgroup label="${t}">${a.map(x=>`<option value="${n++}">${esc(x)}</option>`).join('')}</optgroup>`;i=`<div class="row"><select data-p="${f.tgt}"><option value="">Choisir un texte…</option>${og('Conseils',TC)}${og("Motifs d'orientation",TO)}${S.txt.length?og('Mes textes',S.txt):''}</select><button class="mini" type="button" data-addtxt="${f.tgt}">+ Ajouter</button></div>`}
else if(f.sg){const w=String(v||''),sg=w.startsWith('-')?'-':'+';i=`<div class="row sgr" data-k="${f.k}"><select><option value="+"${sg=='+'?' selected':''}>+</option><option value="-"${sg=='-'?' selected':''}>−</option></select><input type="text" inputmode="decimal" value="${esc(w.replace(/^[+-]/,''))}"></div>`}
else if(f.t=='a')i=`<textarea data-k="${f.k}" rows="2">${esc(v||'')}</textarea>`;
else i=`<input data-k="${f.k}" type="${f.t=='d'?'date':'text'}"${f.t=='n'?' inputmode="decimal"':''} value="${esc(v||'')}">`;
return`<div class="f${f.t=='c'||f.t=='a'||f.w?' w':''}"><span>${l}</span>${i}</div>`};
const grid=fs=>{let h='',cur=null,buf=[];const fl=()=>{if(buf.length)h+=cur?`<section class="eye ${cur}"><h4>${EN[cur]}</h4><div class="g">${buf.join('')}</div></section>`:`<div class="g">${buf.join('')}</div>`;buf=[]};fs.forEach(f=>{const e=eyeOf(f);if(e!==cur){fl();cur=e}buf.push(fh(f,e))});fl();return h};
const sh=([s,n])=>`<details class="st${S.d[s.id]?' ok':''}" data-id="${s.id}"${S.o[s.id]?' open':''}><summary><i class="n">${n}</i>${s.t}</summary><p class="why">${s.why}</p><ol>${s.how.map(h=>`<li>${h}</li>`).join('')}</ol>${grid(s.f)}${s.calc&&s.calc()?`<p class="calc">${s.calc()}</p>`:''}${s.x?s.x():''}<label class="dn"><input type="checkbox" data-d="${s.id}"${S.d[s.id]?' checked':''}> Étape terminée</label></details>`;
const num=L=>L.filter(s=>s.w()).map((s,i)=>[s,i+1]);
const rxs=(p,e)=>{const s=V(`${p}.${e}s`),c=V(`${p}.${e}c`),a=V(`${p}.${e}a`),d=V(`${p}.${e}d`),v=V(`${p}.${e}v`);if(s===''&&c==='')return'–';return`${s||'0.00'}${c?` (${c}) ${a?a+'°':''}`:''}${d?` · add ${d}`:''}${v?` · AV ${v}`:''}`};
const rows=s=>{const g={n:[],od:[],og:[],odg:[]};s.f.forEach(f=>{const x=V(f.k);if(x===''||(Array.isArray(x)&&!x.length))return;g[eyeOf(f)||'n'].push([f.l.replace(/^(OD|OG|ODG) ?/,'')||'résultat',Array.isArray(x)?x.join(', '):String(x)])});let h=g.n.map(([l,v])=>`<tr><td>${l}</td><td>${esc(v)}</td></tr>`).join('');['od','og','odg'].forEach(e=>{if(g[e].length)h+=`<tr class="${e}"><td><b>${U(e)}</b></td><td>${g[e].map(([l,v])=>`${l} ${esc(v)}`).join(' · ')}</td></tr>`});return h};
const cmp=()=>{const cols=[['Ordonnance','ord'],['Objective','o'],['Subjective','sc'],['Proposée','cc']];return`<h2>Correction</h2><table class="cmp"><tr><th></th>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr>${E.map(e=>`<tr class="${e}"><td><b>${U(e)}</b></td>${cols.map(c=>`<td>${esc(rxs(c[1],e))}</td>`).join('')}</tr>`).join('')}</table>`};
const rep=m=>{const cl=m=='cl',L=cl?CL:EX,P=cl?'ka':'a',c=S.cab,dem=V(cl?'kf.dem':'cc.dem'),pt=[['Patient',V('a.nom')],['Naissance',V('a.dob')?`${fdt(V('a.dob'))} (${age()} ans)`:''],["Date de l'examen",fdt(V('a.date'))],['Ordonnance',V(P+'.ord')?`du ${fdt(V(P+'.ord'))}${V(P+'.oph')?' · '+V(P+'.oph'):''}`:''],['Dernier équipement (verres)',cl?'':fdt(V('a.eqp'))],['Situation',V(P+'.prim')],['Plaintes',(V('a.c')||[]).join(', ')],['Situations médicales',(V(P+'.sit')||[]).join(', ')],['Antécédents',V('a.ant')]].filter(x=>x[1]).map(([a,b])=>`<tr><td>${a}</td><td>${esc(b)}</td></tr>`).join('');
const det=L.filter(s=>s.w()&&!['a','ka','ord','ko','o'].includes(s.id)).map(s=>{const r=rows(s),k=s.calc?s.calc():'';return r||k?`<h3>${s.t}</h3>${r?`<table>${r}</table>`:''}${k?`<p>${esc(k)}</p>`:''}`:''}).join('');
const leg=cl?"Adaptation de lentilles de contact réalisée par un opticien-lunetier après examen de la réfraction, dans le cadre des articles D. 4362-1 et suivants du Code de la santé publique (et, pour une première délivrance, du décret n° 2024-617 du 27 juin 2024).":"Renouvellement ou adaptation de verres correcteurs réalisé par un opticien-lunetier après examen de la réfraction, dans le cadre des articles D. 4362-12 et D. 4362-12-1 du Code de la santé publique (et, pour une première délivrance, du décret n° 2024-617 du 27 juin 2024).";
return`<div id="rep"><div class="hd2"><b>${esc(c.nom||'Cabinet')}</b>${c.adr?'<br>'+esc(c.adr):''}${c.tel||c.mail?'<br>'+esc([c.tel,c.mail].filter(Boolean).join(' · ')):''}${c.id?`<br>${esc(c.qual||'Opticien-lunetier')} · n° ${esc(c.id)}`:''}</div>
<h2>${cl?"Compte rendu d'adaptation en lentilles de contact "+(soft()?'souples':'rigides'):"Compte rendu d'examen de réfraction"}</h2>
<p><b>À l'attention de :</b> ${esc(V(P+'.oph')||'—')}</p><table>${pt}</table>
<p><b>Demande :</b> ${esc(dem||'non précisée')}</p>${lgh(lg(cl?CFL:CFX))}${cl?'':cmp()}${det}
<p style="margin-top:22px">Fait le ${fdt(V('a.date'))} · Signature de l'opticien :</p>
<div class="legal"><b>Mentions légales.</b> ${leg} L'adaptation de la correction est reportée sur l'ordonnance (nom, prénom, qualité, identifiant d'enregistrement, date et signature) et le prescripteur en est informé par un moyen garantissant la confidentialité des informations transmises. Ce compte rendu n'est pas une ordonnance et ne constitue pas un diagnostic médical. Il contient des données de santé destinées au seul prescripteur : à transmettre par messagerie sécurisée de santé ou tout moyen garantissant la confidentialité.</div></div>
<div class="bar noprint"><button class="btn p" data-act="print">Imprimer / PDF</button><button class="btn p" data-act="share">Envoyer au prescripteur</button></div>
<p class="note">Données de santé : privilégier une messagerie sécurisée de santé plutôt qu'un e-mail ordinaire.</p>
<div class="bar noprint"><button class="btn" data-act="new">Nouveau dossier</button></div>`};
const reglages=()=>`<h3>Mes informations (comptes rendus)</h3><div class="g">${[['nom','Cabinet / nom'],['qual','Qualité (ex. Opticien-lunetier)'],['adr','Adresse'],['tel','Téléphone'],['mail','E-mail'],['id',"N° d'enregistrement (ADELI / RPPS)"]].map(([k,l])=>`<div class="f w"><span>${l}</span><input type="text" data-c="${k}" value="${esc(S.cab[k]||'')}"></div>`).join('')}</div><h3>Ophtalmologistes</h3>${S.oph.map((o,i)=>`<div class="row"><span>${esc(o.n)}${o.m?' · '+esc(o.m):''}</span><button class="mini" data-deloph="${i}">Supprimer</button></div>`).join('')||'<p class="why">Aucun ophtalmologiste enregistré.</p>'}<div class="bar"><button class="btn" data-addoph="">+ Ajouter un ophtalmologiste</button></div><h3>Mes textes types</h3>${S.txt.map((t,i)=>`<div class="row"><span>${esc(t)}</span><button class="mini" data-deltxt="${i}">Supprimer</button></div>`).join('')||'<p class="why">Aucun texte personnel : ajoutez-en depuis la conclusion avec « + Ajouter ».</p>'}<p class="note">Les données restent sur ce téléphone. Les règles affichées (validité des ordonnances, adaptation, critères de l'arrêté du 25/10/2016) sont des repères : vérifiez les textes en vigueur.</p>`;
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==S.tab));let h='';
if(S.tab=='ex')h=alerts().map(a=>`<div class="al">${a}</div>`).join('')+lgh(lg(CFX),'top')+num(EX).map(sh).join('');
if(S.tab=='cl')h=`<div class="bar"><button data-lt="souple" class="${soft()?'on':''}">Souples</button><button data-lt="rigide" class="${soft()?'':'on'}">Rigides</button></div>`+lgh(lg(CFL),'top')+num(CL).map(sh).join('');
if(S.tab=='rp')h=`<div class="bar noprint"><button data-rt="ex" class="${S.rt=='ex'?'on':''}">Examen de vue</button><button data-rt="cl" class="${S.rt=='cl'?'on':''}">Lentilles</button></div>`+rep(S.rt);

document.addEventListener('click',e=>{const t=e.target.closest('[data-t],[data-lt],[data-rt],[data-addoph],[data-deloph],[data-addtxt],[data-deltxt],[data-act]');if(!t)return;const d=t.dataset;
if(d.t){S.tab=d.t;scrollTo(0,0)}else if(d.lt)S.lt=d.lt;else if(d.rt)S.rt=d.rt;

else if(d.deltxt!==undefined)S.txt.splice(+d.deltxt,1);

else if(d.act=='share'){share();return}
else if(d.act=='new'){if(!confirm('Effacer le dossier en cours ?'))return;S.v={'a.date':today()};S.d={};S.o={}}
else if(d.act=='fill'){const g=(a,b)=>{if(S.v[a]!==undefined)S.v[b]=S.v[a]};E.forEach(e=>{if(d.to=='sc'){g(`sub.${e}s`,`sc.${e}s`);g(`cyl.${e}c`,`sc.${e}c`);g(`cyl.${e}a`,`sc.${e}a`)}else{['s','c','a','v'].forEach(k=>g(`sc.${e}${k}`,`cc.${e}${k}`));g(`pf.${e}`,`cc.${e}d`)}})}
save();render()});
document.addEventListener('toggle',e=>{if(e.target.dataset&&e.target.dataset.id){S.o[e.target.dataset.id]=e.target.open;save()}},true);
document.addEventListener('change',e=>{const t=e.target;
if(t.dataset.c){S.cab[t.dataset.c]=t.value;save();return}
if(t.dataset.p){if(t.value!==''){const k=t.dataset.p,x=allTxt()[+t.value];if(x)S.v[k]=(V(k)?V(k)+'\n':'')+x}save();render();return}
const rw=t.closest('.sgr');if(rw){const k=rw.dataset.k,raw=rw.querySelector('input').value.trim().replace(',','.'),x=parseFloat(raw);if(raw===''||isNaN(x)){S.v[k]='';save();return}const ng=raw[0]=='-'?true:raw[0]=='+'?false:rw.querySelector('select').value=='-';S.v[k]=x===0?'0.00':(ng?'-':'+')+Math.abs(x).toFixed(2);save();render();return}
if(t.dataset.d)S.d[t.dataset.d]=t.checked;
else if(t.dataset.k){const k=t.dataset.k;if(t.type=='checkbox'){const a=new Set(S.v[k]||[]);t.checked?a.add(t.value):a.delete(t.value);S.v[k]=[...a]}else{let v=t.value;const f=fdef(k);if(f&&(f.sg||f.neg)){const x=parseFloat(v.replace(',','.'));if(!isNaN(x))v=f.neg?(x===0?'0.00':(-Math.abs(x)).toFixed(2)):((x>0?'+':'')+x.toFixed(2))}S.v[k]=v}}
